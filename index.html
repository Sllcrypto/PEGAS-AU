/* SQL_SETUP (correr una sola vez en Supabase SQL editor):

/* ====================== LOGICA DE DATOS ====================== */

const SUCURSALES_ESPERADAS = ["CENTRAL", "ESQUINA", "HATILLO"];

const COLUMN_MAP = {
  codigo: ["codigo", "código", "cod"],
  descripcion: ["nombre del producto", "descripcion", "descripción"],
  costo: ["costo mercado colones", "costo de ultima compra", "costo de última compra", "costo"],
  fechaCompra: ["fecha de la ultima compra", "fecha de ultima compra", "fecha de última compra"],
  cantidadComprada: ["cantidad de ultima compra", "cantidades compradas en total"],
  stock: ["stock", "saldo", "existencias"],
  precioSinImp: ["precio sin"],
  precioConImp: ["precio con"],
};

function normalizeHeader(h) {
  return String(h || "").trim().toLowerCase();
}

function buildColumnIndex(headers) {
  const idx = {};
  const normalized = headers.map(normalizeHeader);
  for (const [key, aliases] of Object.entries(COLUMN_MAP)) {
    let found = -1;
    for (const alias of aliases) {
      const i = normalized.findIndex((h) => h === alias || h.includes(alias));
      if (i !== -1) { found = i; break; }
    }
    idx[key] = found;
  }
  return idx;
}

/* Detecta columnas de mes tipo "Jul-25", "Ago-25", etc. */
function isMonthHeader(h) {
  return /^[a-zA-Z]{3}-\d{2}$/.test(String(h || "").trim());
}

function toNumber(value) {
  if (typeof value === "number") return value;
  if (typeof value === "string") {
    const cleaned = value.replace(/[^0-9.,-]/g, "").replace(",", ".");
    const n = parseFloat(cleaned);
    return isNaN(n) ? 0 : n;
  }
  return 0;
}

/* Lee una hoja de sucursal completa: encabezados en la fila 1, fila 2 es subtitulo
   ("Unidades Netas Vendidas"), fila 3 es el TOTAL general de la hoja (se salta), y los
   datos de producto empiezan en la fila 4. El margen no viene en el Excel: se calcula
   desde costo y precio sin impuesto. */
function parseSucursalSheet(rows, sucursal, marginLookup) {
  if (!rows.length) return [];
  const headers = rows[0];
  const idx = buildColumnIndex(headers);
  const monthCols = [];
  headers.forEach((h, i) => { if (isMonthHeader(h)) monthCols.push(i); });
  const totalIdx = headers.findIndex((h) => normalizeHeader(h) === "total");
  const promedioIdx = headers.findIndex((h) => normalizeHeader(h) === "promedio");

  const out = [];
  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    if (!row) continue;
    const codigoRaw = idx.codigo !== -1 ? row[idx.codigo] : undefined;
    const codigo = codigoRaw === undefined || codigoRaw === null ? "" : String(codigoRaw).trim();
    if (!codigo || codigo.toUpperCase() === "TOTAL") continue;

    const costo = toNumber(idx.costo !== -1 ? row[idx.costo] : 0);
    const precioSinImp = toNumber(idx.precioSinImp !== -1 ? row[idx.precioSinImp] : 0);
    const precioConImp = toNumber(idx.precioConImp !== -1 ? row[idx.precioConImp] : 0);
    let margen;
    let margenEstimado = false;
    if (costo > 0 && precioSinImp > 0) {
      margen = (precioSinImp / costo - 1) * 100;
    } else if (marginLookup && marginLookup[codigo] !== undefined) {
      margen = marginLookup[codigo];
      margenEstimado = true;
    } else {
      margen = 0;
    }

    const ventasMensuales = monthCols.map((ci) => toNumber(row[ci]));
    const ventaTotal = totalIdx !== -1 ? toNumber(row[totalIdx]) : ventasMensuales.reduce((a, b) => a + b, 0);
    const ventaPromedio = promedioIdx !== -1 ? toNumber(row[promedioIdx]) : (ventasMensuales.length ? ventaTotal / ventasMensuales.length : 0);

    let mesesSinVenta = 0;
    for (let m = ventasMensuales.length - 1; m >= 0; m--) {
      if (ventasMensuales[m] > 0) break;
      mesesSinVenta++;
    }

    out.push({
      sucursal,
      codigo,
      descripcion: String(idx.descripcion !== -1 ? row[idx.descripcion] ?? "" : ""),
      costo,
      stock: toNumber(idx.stock !== -1 ? row[idx.stock] : 0),
      precioSinImp,
      precioConImp,
      margen: Math.round(margen * 10) / 10,
      margenEstimado,
      ventaTotal,
      ventaPromedio: Math.round(ventaPromedio * 100) / 100,
      mesesSinVenta,
      mesesMonitoreados: monthCols.length || 13,
    });
  }
  return out;
}

/* Hoja de respaldo "CODIGOS %": Codigo, Descripcion, Util, MARGEN EN %.
   Se usa "Util" (precio/costo) para calcular el margen real, no la columna "MARGEN EN %"
   de esa hoja (parece tener un error de escala). Solo se usa si el producto no trae
   costo/precio directo en su hoja de sucursal. */
function parseMarginLookup(rows) {
  const map = {};
  if (!rows.length) return map;
  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    if (!row) continue;
    const codigo = row[0] === undefined || row[0] === null ? "" : String(row[0]).trim();
    const util = toNumber(row[2]);
    if (codigo && util > 0) map[codigo] = (util - 1) * 100;
  }
  return map;
}

function enrich(rows) {
  return rows.map((r) => ({
    ...r,
    capitalAtrapado: r.costo * r.stock,
    mesesInventario: r.ventaPromedio > 0 ? r.stock / r.ventaPromedio : null,
  }));
}

function rankPercentile(values, value) {
  if (!values.length) return 0;
  const sorted = [...values].sort((a, b) => a - b);
  let count = 0;
  for (const v of sorted) if (v <= value) count++;
  return count / sorted.length;
}

/* Version eficiente: ordena una sola vez y usa busqueda binaria por consulta,
   en vez de re-ordenar todo el arreglo por cada fila (critico con miles de productos). */
function makePercentileLookup(values) {
  const sorted = [...values].sort((a, b) => a - b);
  const n = sorted.length;
  return (value) => {
    if (!n) return 0;
    let lo = 0, hi = n;
    while (lo < hi) {
      const mid = (lo + hi) >>> 1;
      if (sorted[mid] <= value) lo = mid + 1;
      else hi = mid;
    }
    return lo / n;
  };
}

function withScore(rows) {
  const capitalPercentil = makePercentileLookup(rows.map((r) => r.capitalAtrapado));
  const mesesPercentil = makePercentileLookup(rows.map((r) => r.mesesSinVenta ?? 0));
  const margenPercentil = makePercentileLookup(rows.map((r) => r.margen));
  return rows.map((r) => {
    const pCapital = capitalPercentil(r.capitalAtrapado);
    const pMeses = mesesPercentil(r.mesesSinVenta ?? 0);
    const pMargenBajo = 1 - margenPercentil(r.margen);
    const score = pCapital * 0.4 + pMeses * 0.35 + pMargenBajo * 0.25;
    return { ...r, score, pCapital, pMeses, pMargenBajo };
  });
}

function money(n, symbol) {
  const formatted = new Intl.NumberFormat("es-CR", { maximumFractionDigits: 0 }).format(Math.round(n || 0));
  return symbol ? `${symbol} ${formatted}` : formatted;
}

function scoreBadgeClasses(score) {
  if (score >= 0.66) return "bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300";
  if (score >= 0.33) return "bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300";
  return "bg-green-100 text-green-700 dark:bg-green-900/40 dark:text-green-300";
}

/* Clasificacion calculada por la app (no viene del Excel): Grupo A = mayor riesgo/prioridad,
   Grupo B = riesgo medio, Grupo C = bajo riesgo, buen movimiento. */
function grupoCalculado(score) {
  if (score >= 0.66) return "A";
  if (score >= 0.33) return "B";
  return "C";
}

function grupoBadgeClasses(grupo) {
  if (grupo === "A") return "bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300";
  if (grupo === "B") return "bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300";
  return "bg-green-100 text-green-700 dark:bg-green-900/40 dark:text-green-300";
}

/* Motor de estrategia financiera por reglas (sin IA externa). Usa los percentiles ya calculados
   en withScore: pCapital, pDias, pMargenBajo, ademas del score general. */
function estrategiaFinanciera(r) {
  const altoCapital = r.pCapital >= 0.66;
  const medioCapital = r.pCapital >= 0.33 && r.pCapital < 0.66;
  const altoMeses = r.pMeses >= 0.66;
  const bajoMeses = r.pMeses < 0.33;
  const margenBajo = r.pMargenBajo >= 0.66;
  const margenAlto = r.pMargenBajo < 0.33;
  const sinVentaTotal = r.mesesSinVenta >= r.mesesMonitoreados;

  if (sinVentaTotal && altoCapital) {
    return {
      titulo: "Cero ventas en todo el periodo - candidato a descontinuar",
      texto: `No registra ninguna venta en los ${r.mesesMonitoreados} meses monitoreados, y hay bastante capital invertido en el. Es la senal mas fuerte posible: evaluar descontinuar el producto, liquidar el stock existente y no volver a comprarlo.`,
    };
  }
  if (altoCapital && margenBajo && altoMeses) {
    return {
      titulo: "Liquidar con descuento agresivo",
      texto: "Combina las tres senales de riesgo a la vez: mucho capital invertido, poco margen y muchos meses sin venderse. Es el peor escenario financiero posible para este producto: cada mes que sigue en bodega cuesta mas de lo que puede recuperar. Prioridad alta de liquidacion, incluso con descuento fuerte.",
    };
  }
  if (altoCapital && margenAlto && altoMeses) {
    return {
      titulo: "Promocion o combo, no descuento profundo",
      texto: "Tiene buen margen, asi que hay espacio para bajar el precio sin perder tanto y generar movimiento, en vez de liquidar de una vez. Considerar armar un combo con un producto de alta rotacion, o una promocion puntual.",
    };
  }
  if (altoCapital && bajoMeses) {
    return {
      titulo: "Monitorear, aun no es pega confirmada",
      texto: "Hay mucho capital invertido, pero todavia se ha vendido recientemente. Todavia no hay suficiente tiempo sin movimiento para considerarlo un problema real de rotacion. Revisar de nuevo el proximo mes.",
    };
  }
  if (!altoCapital && !medioCapital && altoMeses && margenBajo) {
    return {
      titulo: "Baja prioridad, incluir en descuento general",
      texto: "El monto de capital atrapado es bajo, asi que el impacto financiero de dejarlo quieto es menor. No amerita una accion dedicada; se puede incluir en una liquidacion general de temporada en vez de gestionarlo individualmente.",
    };
  }
  if (!altoCapital && altoMeses && margenAlto) {
    return {
      titulo: "Evaluar devolucion a proveedor",
      texto: "El capital atrapado es bajo y el margen es bueno, pero lleva muchos meses sin venderse. Si el proveedor tiene politica de devolucion o cambio, puede ser mejor negocio devolverlo que descontarlo.",
    };
  }
  if (medioCapital && !altoMeses && !margenBajo) {
    return {
      titulo: "Sin accion inmediata",
      texto: "Los indicadores estan en rango medio, sin ninguna senal fuerte de riesgo. Conviene monitorear en el proximo corte mensual en vez de tomar una accion ahora.",
    };
  }
  return {
    titulo: "Revisar en el proximo corte",
    texto: "No hay una combinacion clara de senales de riesgo todavia. Conviene volver a evaluar este producto en el proximo listado mensual para ver como evoluciona.",
  };
}

/* Detecta el simbolo de moneda tal como aparece en las columnas de costo/precio
   del Excel original (raw:false trae el texto formateado, ej. "₡8,500.00") */
function detectCurrencySymbol(rowsFormatted, idx) {
  const candidateCols = ["costo", "precioSinImp", "precioConImp"].map((k) => idx[k]).filter((i) => i !== -1);
  for (const col of candidateCols) {
    for (let r = 1; r < Math.min(rowsFormatted.length, 20); r++) {
      const cell = rowsFormatted[r] ? rowsFormatted[r][col] : undefined;
      if (typeof cell === "string") {
        const match = cell.match(/[^\d\s.,-]+/);
        if (match && match[0].trim()) return match[0].trim();
      }
    }
  }
  return null;
}

function sampleData() {
  const sucursales = ["Central", "Esquina", "Hatillo"];
  const nombres = [
    "Perfume Aurea 100ml", "Perfume Nocturne 50ml", "Tenis runner blanco", "Tenis urban negro",
    "Perfume Velvet Rose", "Sandalia clasica", "Perfume Oud Intense", "Tenis skate gris",
    "Perfume Citrus Fresh", "Bota casual cafe", "Perfume Amber Wood", "Tenis training azul",
  ];
  const rows = [];
  let n = 0;
  for (const suc of sucursales) {
    for (let i = 0; i < 12; i++) {
      n++;
      const nombre = nombres[(n * 3) % nombres.length];
      const costo = 8000 + ((n * 137) % 40000);
      const stock = 1 + ((n * 5) % 30);
      const margenPct = 8 + ((n * 13) % 45);
      const precioSinImp = costo * (1 + margenPct / 100);
      const precioConImp = precioSinImp * 1.13;
      const mesesMonitoreados = 13;
      // simula estacionalidad: algunos productos sin venta reciente, otros con venta activa
      const patron = n % 4;
      const ventasMensuales = Array.from({ length: mesesMonitoreados }, (_, m) => {
        if (patron === 0) return 0; // sin ninguna venta
        if (patron === 1 && m < mesesMonitoreados - 8) return 0; // sin venta hace 8 meses
        return (n + m) % 5;
      });
      const ventaTotal = ventasMensuales.reduce((a, b) => a + b, 0);
      const ventaPromedio = ventaTotal / mesesMonitoreados;
      let mesesSinVenta = 0;
      for (let m = ventasMensuales.length - 1; m >= 0; m--) {
        if (ventasMensuales[m] > 0) break;
        mesesSinVenta++;
      }
      rows.push({
        sucursal: suc, codigo: `SKU-${1000 + n}`, descripcion: nombre, costo, stock,
        precioSinImp, precioConImp, margen: Math.round(margenPct * 10) / 10, margenEstimado: false,
        ventaTotal, ventaPromedio: Math.round(ventaPromedio * 100) / 100, mesesSinVenta, mesesMonitoreados,
      });
    }
  }
  return rows;
}

/* ====================== EXPORTACION ====================== */

function exportExcel(rows, view, moneda) {
  const etiquetaCapital = moneda ? `Capital atrapado (${moneda})` : "Capital atrapado";
  const cols = rows.map((r) => ({
    Codigo: r.codigo, Descripcion: r.descripcion, Sucursal: r.sucursal, Grupo: grupoCalculado(r.score),
    Stock: r.stock, [etiquetaCapital]: Math.round(r.capitalAtrapado),
    "Meses sin venta": r.mesesSinVenta ?? "", "Margen %": r.margen,
    ...(view !== "capital" ? { Score: Math.round(r.score * 100) } : {}),
  }));
  const ws = XLSX.utils.json_to_sheet(cols);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Reporte pegas");
  XLSX.writeFile(wb, `reporte-pegas-${new Date().toISOString().slice(0, 10)}.xlsx`);
}

function buildPdfDoc(rows, view, titulo, moneda) {
  const doc = new window.jspdf.jsPDF({ orientation: "landscape" });
  doc.setFontSize(14);
  doc.text(titulo, 14, 15);
  doc.setFontSize(9);
  doc.text(`Generado ${new Date().toLocaleDateString("es-CR")}`, 14, 21);
  const head = [["#", "Codigo", "Descripcion", "Sucursal", "Grupo", "Stock", "Capital atrapado", "Meses sin venta", "Margen"]];
  if (view !== "capital") head[0].push("Score");
  const body = rows.map((r, i) => {
    const row = [i + 1, r.codigo, r.descripcion, r.sucursal, grupoCalculado(r.score), r.stock,
      money(r.capitalAtrapado, moneda), r.mesesSinVenta ?? "-", `${r.margen}%`];
    if (view !== "capital") row.push(Math.round(r.score * 100));
    return row;
  });
  doc.autoTable({ head, body, startY: 26, styles: { fontSize: 8 } });
  return doc;
}

function exportPdf(rows, view, titulo, moneda) {
  const doc = buildPdfDoc(rows, view, titulo, moneda);
  doc.save(`reporte-pegas-${new Date().toISOString().slice(0, 10)}.pdf`);
}

/* ====================== COMPONENTE PRINCIPAL ====================== */

function App() {
  const [parsedRaw, setParsedRaw] = useState(() => sampleData());
  const [usingSample, setUsingSample] = useState(true);
  const [fileName, setFileName] = useState("");
  const [view, setView] = useState("capital");
  const [sucursalFiltro, setSucursalFiltro] = useState("Todas");
  const [topN, setTopN] = useState(20);
  const [error, setError] = useState("");
  const [tab, setTab] = useState("analisis");
  const [historial, setHistorial] = useState([]);
  const [guardando, setGuardando] = useState(false);
  const [reportModal, setReportModal] = useState(false);
  const [reportVista, setReportVista] = useState("actual");
  const [reportFormato, setReportFormato] = useState("pdf");
  const [correoDestino, setCorreoDestino] = useState("");
  const [moneda, setMoneda] = useState("₡");
  const [previewMode, setPreviewMode] = useState(false);
  const [previewFilas, setPreviewFilas] = useState([]);
  const [previewVista, setPreviewVista] = useState("capital");
  const [previewPdfUrl, setPreviewPdfUrl] = useState(null);
  const [theme, setTheme] = useState("light");

  useEffect(() => {
    document.documentElement.classList.toggle("dark", theme === "dark");
  }, [theme]);

  const supabaseListo = !!supabaseClient;

  const cargarHistorial = useCallback(async () => {
    if (!supabaseClient) return;
    const { data, error } = await supabaseClient
      .from("pegas_uploads")
      .select("id, created_at, nombre_archivo, filas")
      .order("created_at", { ascending: false })
      .limit(30);
    if (!error) setHistorial(data || []);
  }, []);

  useEffect(() => {
    if (tab === "historial") cargarHistorial();
  }, [tab, cargarHistorial]);

  const handleFile = useCallback((e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setError("");
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = new Uint8Array(evt.target.result);
        const wb = XLSX.read(data, { type: "array", cellDates: true });

        const nombresHojas = wb.SheetNames;
        const hojasSucursal = nombresHojas.filter((n) =>
          SUCURSALES_ESPERADAS.includes(n.trim().toUpperCase())
        );
        if (!hojasSucursal.length) {
          setError(`No encontre hojas llamadas ${SUCURSALES_ESPERADAS.join(", ")}. Hojas en el archivo: ${nombresHojas.join(", ")}`);
          return;
        }

        const hojaLookup = nombresHojas.find((n) => normalizeHeader(n).includes("codigos"));
        let marginLookup = {};
        if (hojaLookup) {
          const rowsLookup = XLSX.utils.sheet_to_json(wb.Sheets[hojaLookup], { header: 1, raw: true });
          marginLookup = parseMarginLookup(rowsLookup);
        }

        let parsedTotal = [];
        let simboloDetectado = null;
        for (const nombreHoja of hojasSucursal) {
          const sheet = wb.Sheets[nombreHoja];
          const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true });
          const sucursalLabel = nombreHoja.trim();
          const parsedHoja = parseSucursalSheet(rows, sucursalLabel, marginLookup);
          parsedTotal = parsedTotal.concat(parsedHoja);

          if (!simboloDetectado) {
            const rowsFormateadas = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false });
            const idx = buildColumnIndex(rows[0] || []);
            simboloDetectado = detectCurrencySymbol(rowsFormateadas, idx);
          }
        }

        if (!parsedTotal.length) {
          setError("No se encontraron filas con codigo valido en ninguna hoja de sucursal.");
          return;
        }

        setMoneda(simboloDetectado || "₡");
        setParsedRaw(parsedTotal);
        setUsingSample(false);
        setFileName(`${file.name} (${hojasSucursal.join(", ")})`);
        setSucursalFiltro("Todas");
      } catch (err) {
        setError("No se pudo leer el archivo: " + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }, []);

  const guardarEnHistorial = useCallback(async () => {
    if (!supabaseClient) {
      setError("Supabase no esta configurado todavia en este archivo.");
      return;
    }
    setGuardando(true);
    const { error } = await supabaseClient.from("pegas_uploads").insert({
      nombre_archivo: fileName || "datos de ejemplo",
      filas: parsedRaw.length,
      data: parsedRaw,
    });
    setGuardando(false);
    if (error) setError("No se pudo guardar en el historial: " + error.message);
  }, [parsedRaw, fileName]);

  const cargarDesdeHistorial = useCallback(async (id) => {
    if (!supabaseClient) return;
    const { data, error } = await supabaseClient.from("pegas_uploads").select("data, nombre_archivo").eq("id", id).single();
    if (!error && data) {
      setParsedRaw(data.data);
      setFileName(data.nombre_archivo);
      setUsingSample(false);
      setTab("analisis");
    }
  }, []);

  const enriched = useMemo(() => withScore(enrich(parsedRaw)), [parsedRaw]);

  const sucursales = useMemo(() => {
    const set = new Set(enriched.map((r) => r.sucursal));
    return ["Todas", ...Array.from(set).sort()];
  }, [enriched]);

  const filtered = useMemo(() => enriched.filter((r) =>
    (sucursalFiltro === "Todas" || r.sucursal === sucursalFiltro)
  ), [enriched, sucursalFiltro]);

  const sorted = useMemo(() => {
    const copy = [...filtered];
    if (view === "capital") copy.sort((a, b) => b.capitalAtrapado - a.capitalAtrapado);
    else copy.sort((a, b) => b.score - a.score);
    return copy.slice(0, topN);
  }, [filtered, view, topN]);

  const estrategiaLista = useMemo(() => {
    const copy = [...filtered].sort((a, b) => b.score - a.score);
    return copy.slice(0, topN);
  }, [filtered, topN]);

  const totals = useMemo(() => ({
    capitalTotal: filtered.reduce((s, r) => s + r.capitalAtrapado, 0),
    capitalTop: sorted.reduce((s, r) => s + r.capitalAtrapado, 0),
    count: filtered.length,
  }), [filtered, sorted]);

  function calcularFilasReporte() {
    const usarVista = reportVista === "actual" ? view : reportVista;
    const filas = usarVista === view ? sorted : (() => {
      const copy = [...filtered];
      if (usarVista === "capital") copy.sort((a, b) => b.capitalAtrapado - a.capitalAtrapado);
      else copy.sort((a, b) => b.score - a.score);
      return copy.slice(0, topN);
    })();
    return { filas, usarVista };
  }

  function verVistaPrevia() {
    const { filas, usarVista } = calcularFilasReporte();
    setPreviewFilas(filas);
    setPreviewVista(usarVista);
    if (reportFormato === "pdf") {
      const titulo = usarVista === "capital" ? "Reporte - Mayor capital atrapado" : "Reporte - Candidatos reales a pega";
      const doc = buildPdfDoc(filas, usarVista, titulo, moneda);
      if (previewPdfUrl) URL.revokeObjectURL(previewPdfUrl);
      const url = doc.output("bloburl");
      setPreviewPdfUrl(url);
    }
    setPreviewMode(true);
  }

  function confirmarDescarga() {
    const titulo = previewVista === "capital" ? "Reporte - Mayor capital atrapado" : "Reporte - Candidatos reales a pega";
    if (reportFormato === "pdf") exportPdf(previewFilas, previewVista, titulo, moneda);
    else exportExcel(previewFilas, previewVista, moneda);
  }

  function cerrarReporte() {
    setReportModal(false);
    setPreviewMode(false);
    if (previewPdfUrl) URL.revokeObjectURL(previewPdfUrl);
    setPreviewPdfUrl(null);
  }

  function abrirCorreo() {
    const asunto = encodeURIComponent("Reporte de pegas - " + new Date().toLocaleDateString("es-CR"));
    const cuerpo = encodeURIComponent(
      "Buenas,\n\nAdjunto el reporte de productos de baja rotacion (pegas).\n\nSaludos."
    );
    window.location.href = `mailto:${correoDestino}?subject=${asunto}&body=${cuerpo}`;
  }

  return (
    <div className="max-w-6xl mx-auto p-4 space-y-5 text-stone-800 dark:text-stone-100 min-h-screen">
      <div className="h-1 w-full rounded-full mb-1" style={{ background: "linear-gradient(90deg, #059669 0%, #2563eb 50%, #7c3aed 100%)" }} />
      <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div>
          <h1 className="text-xl font-semibold text-stone-900 dark:text-stone-50">Analisis de pegas</h1>
          <p className="text-sm text-stone-500 dark:text-stone-400">Productos de baja rotacion por sucursal</p>
        </div>
        <div className="flex gap-2">
          <button onClick={() => setTab("analisis")}
            className={`px-3 py-1.5 rounded-lg text-sm border ${tab === "analisis" ? "bg-emerald-600 text-white border-emerald-600" : "border-stone-300 dark:border-stone-700 text-stone-600 dark:text-stone-300"}`}>
            Analisis
          </button>
          <button onClick={() => setTab("estrategia")}
            className={`px-3 py-1.5 rounded-lg text-sm border ${tab === "estrategia" ? "bg-violet-600 text-white border-violet-600" : "border-stone-300 dark:border-stone-700 text-stone-600 dark:text-stone-300"}`}>
            Estrategia financiera
          </button>
          <button onClick={() => setTab("historial")}
            className={`px-3 py-1.5 rounded-lg text-sm border ${tab === "historial" ? "bg-blue-600 text-white border-blue-600" : "border-stone-300 dark:border-stone-700 text-stone-600 dark:text-stone-300"}`}>
            Historial
          </button>
          <button onClick={() => setTheme(theme === "light" ? "dark" : "light")}
            title="Cambiar modo claro/oscuro"
            className="px-3 py-1.5 rounded-lg text-sm border border-stone-300 dark:border-stone-700 text-stone-600 dark:text-stone-300">
            {theme === "light" ? "🌙" : "☀️"}
          </button>
        </div>
      </div>

      {!supabaseListo && (
        <div className="bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-800 rounded-lg px-3 py-2 text-sm text-amber-800 dark:text-amber-300">
          Supabase no esta configurado en este archivo todavia (edita SUPABASE_URL y SUPABASE_ANON_KEY al inicio del HTML). El historial no funcionara hasta que lo conectes.
        </div>
      )}

      {tab === "historial" ? (
        <div className="border border-stone-200 dark:border-stone-800 rounded-lg divide-y divide-stone-100 dark:divide-stone-800">
          {historial.length === 0 && (
            <p className="p-4 text-sm text-stone-400">No hay cargas guardadas todavia.</p>
          )}
          {historial.map((h) => (
            <div key={h.id} className="p-3 flex items-center justify-between text-sm">
              <div>
                <p className="font-medium">{h.nombre_archivo}</p>
                <p className="text-stone-400">{new Date(h.created_at).toLocaleString("es-CR")} - {h.filas} filas</p>
              </div>
              <button onClick={() => cargarDesdeHistorial(h.id)} className="px-3 py-1.5 border border-stone-300 rounded-lg hover:bg-stone-50">
                Cargar
              </button>
            </div>
          ))}
        </div>
      ) : tab === "estrategia" ? (
        <div className="space-y-3">
          <p className="text-sm text-stone-500 dark:text-stone-400">
            Sugerencias generadas por reglas segun capital atrapado, meses sin venta y margen de cada producto (filtro y Top actuales). No son ideas de mercadeo/publicidad, son acciones financieras: liquidar, promocionar, devolver a proveedor o monitorear.
          </p>
          {estrategiaLista.length === 0 && (
            <p className="text-sm text-stone-400 p-4">Sin datos para este filtro.</p>
          )}
          {estrategiaLista.map((r, i) => {
            const est = estrategiaFinanciera(r);
            const grupo = grupoCalculado(r.score);
            return (
              <div key={`${r.codigo}-${i}`} className="border border-stone-200 dark:border-stone-800 rounded-lg p-3 space-y-1.5">
                <div className="flex items-start justify-between gap-2">
                  <div>
                    <p className="font-medium text-stone-900 dark:text-stone-50">{r.codigo} - {r.descripcion}</p>
                    <p className="text-xs text-stone-500 dark:text-stone-400">{r.sucursal} - Stock {r.stock} - Capital {money(r.capitalAtrapado, moneda)}</p>
                  </div>
                  <span className={`shrink-0 inline-block w-6 h-6 leading-6 text-center rounded-full text-xs font-semibold ${grupoBadgeClasses(grupo)}`}>
                    {grupo}
                  </span>
                </div>
                <p className="text-sm font-medium text-violet-700 dark:text-violet-400">{est.titulo}</p>
                <p className="text-sm text-stone-600 dark:text-stone-300">{est.texto}</p>
              </div>
            );
          })}
        </div>
      ) : (
        <React.Fragment>
          <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
            <div className="flex items-center gap-2 flex-wrap">
              <label className="inline-flex items-center gap-2 px-3 py-2 border border-stone-300 rounded-lg text-sm cursor-pointer hover:bg-stone-50">
                Subir Excel
                <input type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={handleFile} />
              </label>
              {!usingSample && (
                <button onClick={() => { setParsedRaw(sampleData()); setUsingSample(true); setFileName(""); setMoneda("₡"); }}
                  className="px-3 py-2 border border-stone-300 rounded-lg text-sm hover:bg-stone-50">
                  Datos de ejemplo
                </button>
              )}
              <button onClick={guardarEnHistorial} disabled={guardando}
                className="px-3 py-2 border border-emerald-300 text-emerald-700 rounded-lg text-sm hover:bg-emerald-50 disabled:opacity-50">
                {guardando ? "Guardando..." : "Guardar en historial"}
              </button>
            </div>
            <button onClick={() => setReportModal(true)}
              className="px-3 py-2 bg-violet-600 text-white rounded-lg text-sm hover:bg-violet-700">
              Generar reporte
            </button>
          </div>

          {usingSample && (
            <div className="bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 text-sm text-amber-800">
              Estas viendo datos de ejemplo. Sube tu Excel real para analizar tus productos.
            </div>
          )}
          {!usingSample && fileName && (
            <div className="text-sm text-stone-500">Archivo cargado: {fileName} - {parsedRaw.length} filas leidas</div>
          )}
          {error && (
            <div className="bg-red-50 border border-red-200 rounded-lg px-3 py-2 text-sm text-red-700">{error}</div>
          )}

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div className="bg-emerald-50 rounded-lg p-3 border-l-2 border-emerald-500">
              <p className="text-xs text-emerald-700 mb-1">SKUs en vista actual</p>
              <p className="text-xl font-medium text-emerald-900">{totals.count}</p>
            </div>
            <div className="bg-blue-50 rounded-lg p-3 border-l-2 border-blue-500">
              <p className="text-xs text-blue-700 mb-1">Capital atrapado (filtro)</p>
              <p className="text-xl font-medium text-blue-900">{money(totals.capitalTotal, moneda)}</p>
            </div>
            <div className="bg-violet-50 rounded-lg p-3 border-l-2 border-violet-500">
              <p className="text-xs text-violet-700 mb-1">Capital en el top mostrado</p>
              <p className="text-xl font-medium text-violet-900">{money(totals.capitalTop, moneda)}</p>
            </div>
            <div className="bg-stone-50 rounded-lg p-3 border-l-2 border-stone-400">
              <p className="text-xs text-stone-500 mb-1">Mostrando</p>
              <p className="text-xl font-medium">Top {Math.min(topN, sorted.length)}</p>
            </div>
          </div>

          <div className="flex flex-wrap items-center gap-2">
            <button onClick={() => setView("capital")}
              className={`px-3 py-1.5 rounded-lg text-sm border ${view === "capital" ? "bg-blue-600 text-white border-blue-600" : "border-stone-300 hover:bg-stone-50"}`}>
              Mayor capital atrapado
            </button>
            <button onClick={() => setView("pega")}
              className={`px-3 py-1.5 rounded-lg text-sm border ${view === "pega" ? "bg-violet-600 text-white border-violet-600" : "border-stone-300 hover:bg-stone-50"}`}>
              Candidatos reales a pega
            </button>
            <div className="ml-auto flex flex-wrap items-center gap-2">
              <select value={sucursalFiltro} onChange={(e) => setSucursalFiltro(e.target.value)}
                className="text-sm border border-stone-300 dark:border-stone-700 dark:bg-stone-800 rounded-lg px-2 py-1.5">
                {sucursales.map((s) => <option key={s} value={s}>{s === "Todas" ? "Todas las sucursales" : s}</option>)}
              </select>
              <select value={topN} onChange={(e) => setTopN(Number(e.target.value))}
                className="text-sm border border-stone-300 rounded-lg px-2 py-1.5">
                {[10, 20, 30, 50].map((n) => <option key={n} value={n}>Top {n}</option>)}
              </select>
            </div>
          </div>

          <div className="overflow-x-auto border border-stone-200 dark:border-stone-800 rounded-lg">
            <table className="w-full text-sm">
              <thead className="bg-stone-50 dark:bg-stone-900 text-stone-500 dark:text-stone-400 text-xs uppercase tracking-wide">
                <tr>
                  <th className="text-left px-3 py-2 font-medium">#</th>
                  <th className="text-left px-3 py-2 font-medium">Codigo</th>
                  <th className="text-left px-3 py-2 font-medium">Descripcion</th>
                  <th className="text-left px-3 py-2 font-medium">Sucursal</th>
                  <th className="text-center px-3 py-2 font-medium">Grupo</th>
                  <th className="text-right px-3 py-2 font-medium">Stock</th>
                  <th className="text-right px-3 py-2 font-medium">Capital atrapado</th>
                  <th className="text-right px-3 py-2 font-medium">Meses sin venta</th>
                  <th className="text-right px-3 py-2 font-medium">Margen</th>
                  {view === "pega" && <th className="text-right px-3 py-2 font-medium">Score</th>}
                </tr>
              </thead>
              <tbody>
                {sorted.map((r, i) => (
                  <tr key={`${r.codigo}-${r.sucursal}-${i}`} className="border-t border-stone-100 dark:border-stone-800 hover:bg-stone-50 dark:hover:bg-stone-900">
                    <td className="px-3 py-2 text-stone-400">{i + 1}</td>
                    <td className="px-3 py-2 font-medium">{r.codigo}</td>
                    <td className="px-3 py-2 text-stone-600 dark:text-stone-300">{r.descripcion}</td>
                    <td className="px-3 py-2 text-stone-600 dark:text-stone-300">{r.sucursal}</td>
                    <td className="px-3 py-2 text-center">
                      <span className={`inline-block w-6 h-6 leading-6 rounded-full text-xs font-semibold ${grupoBadgeClasses(grupoCalculado(r.score))}`}>
                        {grupoCalculado(r.score)}
                      </span>
                    </td>
                    <td className="px-3 py-2 text-right">{r.stock}</td>
                    <td className="px-3 py-2 text-right font-medium">{money(r.capitalAtrapado, moneda)}</td>
                    <td className="px-3 py-2 text-right">{r.mesesSinVenta ?? "-"}</td>
                    <td className="px-3 py-2 text-right">{r.margen}%</td>
                    {view === "pega" && (
                      <td className="px-3 py-2 text-right">
                        <span className={`inline-block px-2 py-0.5 rounded-full text-xs font-medium ${scoreBadgeClasses(r.score)}`}>
                          {Math.round(r.score * 100)}
                        </span>
                      </td>
                    )}
                  </tr>
                ))}
                {sorted.length === 0 && (
                  <tr><td colSpan={10} className="px-3 py-6 text-center text-stone-400">Sin datos para este filtro.</td></tr>
                )}
              </tbody>
            </table>
          </div>

          {view === "pega" && (
            <div className="flex items-center gap-4 text-xs text-stone-500">
              <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-green-500"></span>Bajo riesgo</span>
              <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-amber-400"></span>Riesgo medio</span>
              <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-red-500"></span>Alto riesgo (fuerte candidato a pega)</span>
            </div>
          )}

          <p className="text-xs text-stone-400">
            Capital atrapado = costo x stock actual. Score de pega combina capital atrapado, meses consecutivos sin venta
            y margen bajo, segun la posicion relativa dentro del filtro actual (venta real de los ultimos {parsedRaw[0]?.mesesMonitoreados || 13} meses, no un estimado por compra).
          </p>
        </React.Fragment>
      )}

      {reportModal && !previewMode && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
          <div className="bg-white dark:bg-stone-900 rounded-xl p-5 w-full max-w-sm space-y-4">
            <h2 className="font-medium text-stone-900">Generar reporte</h2>

            <div>
              <p className="text-xs text-stone-500 mb-1">Vista a incluir</p>
              <select value={reportVista} onChange={(e) => setReportVista(e.target.value)}
                className="w-full text-sm border border-stone-300 rounded-lg px-2 py-1.5">
                <option value="actual">La vista que estoy viendo ahora ({view === "capital" ? "capital atrapado" : "candidatos a pega"})</option>
                <option value="capital">Mayor capital atrapado</option>
                <option value="pega">Candidatos reales a pega</option>
              </select>
            </div>

            <div>
              <p className="text-xs text-stone-500 mb-1">Formato</p>
              <div className="flex gap-2">
                <button onClick={() => setReportFormato("pdf")}
                  className={`flex-1 px-3 py-1.5 rounded-lg text-sm border ${reportFormato === "pdf" ? "bg-blue-600 text-white border-blue-600" : "border-stone-300"}`}>
                  PDF
                </button>
                <button onClick={() => setReportFormato("excel")}
                  className={`flex-1 px-3 py-1.5 rounded-lg text-sm border ${reportFormato === "excel" ? "bg-blue-600 text-white border-blue-600" : "border-stone-300"}`}>
                  Excel
                </button>
              </div>
            </div>

            <div>
              <p className="text-xs text-stone-500 mb-1">Correo de gerencia (opcional, para el boton de enviar)</p>
              <input type="email" value={correoDestino} onChange={(e) => setCorreoDestino(e.target.value)}
                placeholder="gerencia@empresa.com"
                className="w-full text-sm border border-stone-300 rounded-lg px-2 py-1.5" />
            </div>

            <div className="flex gap-2 pt-2">
              <button onClick={verVistaPrevia} className="flex-1 px-3 py-2 bg-violet-600 text-white rounded-lg text-sm hover:bg-violet-700">
                Ver vista previa
              </button>
            </div>
            <button onClick={cerrarReporte} className="w-full text-xs text-stone-400 hover:text-stone-600 pt-1">
              Cancelar
            </button>
          </div>
        </div>
      )}

      {reportModal && previewMode && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
          <div className="bg-white dark:bg-stone-900 rounded-xl p-5 w-full max-w-3xl max-h-[85vh] flex flex-col space-y-3">
            <div className="flex items-center justify-between">
              <h2 className="font-medium text-stone-900">
                Vista previa - {previewVista === "capital" ? "Mayor capital atrapado" : "Candidatos reales a pega"}
              </h2>
              <button onClick={() => setPreviewMode(false)} className="text-xs text-stone-400 hover:text-stone-600">
                Volver a opciones
              </button>
            </div>

            {reportFormato === "pdf" ? (
              previewPdfUrl ? (
                <iframe src={previewPdfUrl} title="Vista previa PDF" className="w-full flex-1 border border-stone-200 rounded-lg" style={{ minHeight: "50vh" }} />
              ) : (
                <p className="text-sm text-stone-400">Generando vista previa...</p>
              )
            ) : (
              <div className="overflow-auto border border-stone-200 dark:border-stone-800 rounded-lg flex-1">
                <table className="w-full text-sm">
                  <thead className="bg-stone-50 dark:bg-stone-900 text-stone-500 dark:text-stone-400 text-xs uppercase tracking-wide sticky top-0">
                    <tr>
                      <th className="text-left px-3 py-2 font-medium">Codigo</th>
                      <th className="text-left px-3 py-2 font-medium">Descripcion</th>
                      <th className="text-left px-3 py-2 font-medium">Sucursal</th>
                      <th className="text-center px-3 py-2 font-medium">Grupo</th>
                      <th className="text-right px-3 py-2 font-medium">Stock</th>
                      <th className="text-right px-3 py-2 font-medium">Capital atrapado</th>
                      <th className="text-right px-3 py-2 font-medium">Meses sin venta</th>
                      <th className="text-right px-3 py-2 font-medium">Margen</th>
                      {previewVista === "pega" && <th className="text-right px-3 py-2 font-medium">Score</th>}
                    </tr>
                  </thead>
                  <tbody>
                    {previewFilas.map((r, i) => (
                      <tr key={`${r.codigo}-${i}`} className="border-t border-stone-100 dark:border-stone-800">
                        <td className="px-3 py-2 font-medium">{r.codigo}</td>
                        <td className="px-3 py-2 text-stone-600 dark:text-stone-300">{r.descripcion}</td>
                        <td className="px-3 py-2 text-stone-600 dark:text-stone-300">{r.sucursal}</td>
                        <td className="px-3 py-2 text-center">
                          <span className={`inline-block w-6 h-6 leading-6 rounded-full text-xs font-semibold ${grupoBadgeClasses(grupoCalculado(r.score))}`}>
                            {grupoCalculado(r.score)}
                          </span>
                        </td>
                        <td className="px-3 py-2 text-right">{r.stock}</td>
                        <td className="px-3 py-2 text-right font-medium">{money(r.capitalAtrapado, moneda)}</td>
                        <td className="px-3 py-2 text-right">{r.mesesSinVenta ?? "-"}</td>
                        <td className="px-3 py-2 text-right">{r.margen}%</td>
                        {previewVista === "pega" && (
                          <td className="px-3 py-2 text-right">
                            <span className={`inline-block px-2 py-0.5 rounded-full text-xs font-medium ${scoreBadgeClasses(r.score)}`}>
                              {Math.round(r.score * 100)}
                            </span>
                          </td>
                        )}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            <div className="flex gap-2 pt-1">
              <button onClick={confirmarDescarga} className="flex-1 px-3 py-2 bg-violet-600 text-white rounded-lg text-sm hover:bg-violet-700">
                Descargar {reportFormato === "pdf" ? "PDF" : "Excel"}
              </button>
              <button onClick={abrirCorreo} className="flex-1 px-3 py-2 border border-stone-300 rounded-lg text-sm hover:bg-stone-50">
                Abrir correo
              </button>
              <button onClick={cerrarReporte} className="px-3 py-2 border border-stone-300 rounded-lg text-sm hover:bg-stone-50">
                Cerrar
              </button>
            </div>
            <p className="text-xs text-stone-400">
              Revisa la vista previa antes de descargar. El boton "Abrir correo" prepara el mensaje en tu app de correo;
              el archivo lo adjuntas manualmente despues de descargarlo (los navegadores no permiten adjuntar automaticamente).
            </p>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
