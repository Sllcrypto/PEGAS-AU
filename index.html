function exportExcel(rows, view, moneda) {
  const etiquetaCapital = moneda ? `Capital atrapado (${moneda})` : "Capital atrapado";
  const cols = rows.map((r) => ({
    Codigo: r.codigo, Descripcion: r.descripcion, Sucursal: r.sucursal, Grupo: grupoCalculado(r.score),
    Stock: r.stock, [etiquetaCapital]: Math.round(r.capitalAtrapado),
    "Meses sin venta": r.mesesSinVenta ?? "", "Promedio venta mensual": r.ventaPromedio ?? "", "Margen %": r.margen,
    ...(view !== "capital" ? { Score: Math.round(r.score * 100) } : {}),
  }));
  const ws = XLSX.utils.json_to_sheet(cols);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Reporte pegas");
  XLSX.writeFile(wb, `reporte-pegas-${new Date().toISOString().slice(0, 10)}.xlsx`);
}

/* jsPDF (la libreria que arma el PDF) usa una fuente que no incluye el
   simbolo colon (₡, U+20A1) -- por eso en pantalla se ve bien pero en el
   PDF sale un caracter roto. Se cambia solo dentro del PDF por "CRC", el
   codigo internacional oficial del colon (si o si es un simbolo valido en
   reportes financieros formales). Otros simbolos ($, €, £, ¥) si estan
   soportados por la fuente del PDF y se dejan tal cual. */
function monedaSeguraParaPdf(symbol) {
  const mapa = { "₡": "CRC" };
  return mapa[symbol] || symbol;
}

function buildPdfDoc(rows, view, titulo, moneda) {
  const monedaPdf = monedaSeguraParaPdf(moneda);
  const doc = new window.jspdf.jsPDF({ orientation: "landscape" });
  doc.setFontSize(14);
  doc.text(titulo, 14, 15);
  doc.setFontSize(9);
  doc.text(`Generado ${new Date().toLocaleDateString("es-CR")}`, 14, 21);
  const head = [["#", "Codigo", "Descripcion", "Sucursal", "Grupo", "Stock", "Capital atrapado", "Meses sin venta", "Prom. venta mensual", "Margen"]];
  if (view !== "capital") head[0].push("Score");
  const body = rows.map((r, i) => {
    const row = [i + 1, r.codigo, r.descripcion, r.sucursal, grupoCalculado(r.score), r.stock,
      money(r.capitalAtrapado, monedaPdf), r.mesesSinVenta ?? "-", r.ventaPromedio ?? "-", `${r.margen}%`];
    if (view !== "capital") row.push(Math.round(r.score * 100));
    return row;
  });
  doc.autoTable({ head, body, startY: 26, styles: { fontSize: 8 } });
  return doc;
}

function exportPdf(rows, view, titulo, moneda) {
  const doc = buildPdfDoc(rows, view, titulo, moneda);
  doc.save(`reporte-pegas-${new Date().toISOString().slice(0, 10)}.pdf`);
}

/* Tarjeta de una situacion dentro de la bandeja de Acciones. Combina las
   categorias que le apliquen a un mismo codigo+sucursal (nunca tarjetas
   duplicadas). Solo las pegas tienen plan de fases completo (es lo unico
   que el motor de estrategia ya genera); quiebre y sobrecompra muestran
   los datos crudos que ya existen, sin inventar un plan que no existe. */
function SituacionCard({ s, moneda, abierta, onToggle, onVerProducto, onVerSucursales, onVerCompras, mejorSucursalPorCodigo }) {
  const pega = s.categorias.find((c) => c.tipo === "pega");
  const quiebreAgotado = s.categorias.find((c) => c.tipo === "quiebre_agotado");
  const quiebrePorAgotarse = s.categorias.find((c) => c.tipo === "quiebre_por_agotarse");
  const sobrecompra = s.categorias.find((c) => c.tipo === "sobrecompra");

  const badges = [];
  if (pega) badges.push({ label: ARCHETYPE_INFO[pega.est.archetype].label, color: ARCHETYPE_INFO[pega.est.archetype].color });
  if (quiebreAgotado) badges.push({ label: "Quiebre - agotado", color: "bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300" });
  if (quiebrePorAgotarse) badges.push({ label: "Quiebre - por agotarse", color: "bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300" });
  if (sobrecompra) badges.push({ label: "Sobrecompra", color: "bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300" });

  let diagnostico = pega ? pega.est.diagnostico
    : quiebreAgotado ? `Vende ~${Math.round((quiebreAgotado.r.ventaPromedio || 0) * 10) / 10} u/mes y esta sin stock.`
    : quiebrePorAgotarse ? `Quedan ${Math.round(quiebrePorAgotarse.r.mesesInventario * 10) / 10} meses de inventario a este ritmo.`
    : `La ultima compra alcanza para ~${Math.round(sobrecompra.r.mesesQueAlcanza * 10) / 10} meses de venta.`;
  if (pega && sobrecompra) {
    diagnostico += ` Ademas, la ultima compra (${sobrecompra.r.cantidadUltimaCompra} unidades) alcanza para ~${Math.round(sobrecompra.r.mesesQueAlcanza * 10) / 10} meses.`;
  }

  const accion = pega ? pega.est.fases[0].acciones[0]
    : quiebreAgotado ? "Reponer cuanto antes."
    : quiebrePorAgotarse ? "Programar reposicion pronto."
    : "Revisar la proxima orden de compra.";

  const impactoTexto = pega ? money(pega.r.capitalAtrapado, moneda) : sobrecompra ? money(sobrecompra.r.capitalCompra, moneda) : null;

  const otraSucursal = mejorSucursalPorCodigo[s.codigo];
  const puedeCompararSucursales = !!(otraSucursal && otraSucursal.sucursal !== s.sucursal);
  const puedeVerCompras = !!sobrecompra;

  return (
    <div className="border border-stone-200 dark:border-stone-800 rounded-lg overflow-hidden">
      <button onClick={onToggle} className="w-full text-left p-3 hover:bg-stone-50 dark:hover:bg-stone-900 space-y-1.5">
        <div className="flex items-start justify-between gap-2">
          <p className="font-medium text-sm text-stone-900 dark:text-stone-50">{s.codigo} - {s.descripcion} <span className="text-stone-400 font-normal">· {s.sucursal}</span></p>
          <span className="text-stone-400 text-xs shrink-0">{abierta ? "▲" : "▼"}</span>
        </div>
        <div className="flex flex-wrap gap-1">
          {badges.map((b, i) => <span key={i} className={`inline-block px-2 py-0.5 rounded-full text-xs font-medium ${b.color}`}>{b.label}</span>)}
        </div>
        <p className="text-xs text-stone-600 dark:text-stone-300">{diagnostico}</p>
        <p className="text-xs text-emerald-700 dark:text-emerald-400">→ {accion}{impactoTexto ? ` · ${impactoTexto}` : ""}</p>
      </button>
      {abierta && (
        <div className="border-t border-stone-200 dark:border-stone-800 p-3 space-y-3 bg-stone-50/50 dark:bg-stone-900/30">
          {pega ? (
            <div className="space-y-3">
              {pega.est.fases.map((fase, fi) => (
                <div key={fi} className="flex gap-2.5">
                  <div className="flex flex-col items-center">
                    <span className="w-5 h-5 rounded-full bg-violet-600 text-white text-xs flex items-center justify-center shrink-0 font-medium">{fi + 1}</span>
                    {fi < pega.est.fases.length - 1 && <span className="w-px flex-1 bg-stone-300 dark:bg-stone-700 mt-1"></span>}
                  </div>
                  <div className="pb-2 space-y-1 flex-1">
                    <p className="text-sm font-medium text-stone-900 dark:text-stone-50">{fase.nombre}</p>
                    <p className="text-xs text-stone-400">{fase.duracion}</p>
                    <ul className="text-sm text-stone-600 dark:text-stone-300 list-disc pl-4 space-y-0.5">
                      {fase.acciones.map((a, ai) => <li key={ai}>{a}</li>)}
                    </ul>
                    {fase.exito && <p className="text-xs text-emerald-700 dark:text-emerald-400"><span className="font-medium">Exito si:</span> {fase.exito}</p>}
                    {fase.siNoFunciona && <p className="text-xs text-amber-700 dark:text-amber-400"><span className="font-medium">Si no funciona:</span> {fase.siNoFunciona}</p>}
                  </div>
                </div>
              ))}
            </div>
          ) : (
            <div className="text-sm text-stone-600 dark:text-stone-300 space-y-1">
              {quiebreAgotado && <p>Stock actual: 0 · Venta promedio: {Math.round((quiebreAgotado.r.ventaPromedio || 0) * 100) / 100} u/mes</p>}
              {quiebrePorAgotarse && <p>Stock actual: {quiebrePorAgotarse.r.stock} · Meses de inventario: {Math.round(quiebrePorAgotarse.r.mesesInventario * 10) / 10}</p>}
              {sobrecompra && <p>Ultima compra: {sobrecompra.r.cantidadUltimaCompra} unidades · Capital: {money(sobrecompra.r.capitalCompra, moneda)} · Cobertura: {Math.round(sobrecompra.r.mesesQueAlcanza * 10) / 10} meses</p>}
            </div>
          )}
          <div className="flex flex-wrap gap-2 pt-1">
            <button onClick={onVerProducto} className="px-2.5 py-1 text-xs border border-stone-300 dark:border-stone-700 rounded-lg hover:bg-stone-100 dark:hover:bg-stone-800">Ver ficha completa del producto →</button>
            {puedeCompararSucursales && <button onClick={onVerSucursales} className="px-2.5 py-1 text-xs border border-stone-300 dark:border-stone-700 rounded-lg hover:bg-stone-100 dark:hover:bg-stone-800">Comparar entre sucursales →</button>}
            {puedeVerCompras && <button onClick={onVerCompras} className="px-2.5 py-1 text-xs border border-stone-300 dark:border-stone-700 rounded-lg hover:bg-stone-100 dark:hover:bg-stone-800">Ver en Compras →</button>}
          </div>
        </div>
      )}
    </div>
  );
}

/* ====================== COMPONENTE PRINCIPAL ====================== */

function App() {
  const [parsedRaw, setParsedRaw] = useState(() => sampleData());
  const [usingSample, setUsingSample] = useState(true);
  const [fileName, setFileName] = useState("");
  const [view, setView] = useState("capital");
  const [sucursalFiltro, setSucursalFiltro] = useState("Todas");
  const [busquedaCodigo, setBusquedaCodigo] = useState("");
  const [busquedaDescripcion, setBusquedaDescripcion] = useState("");
  const [busquedaMargen, setBusquedaMargen] = useState("");
  const [busquedaMesesSinVenta, setBusquedaMesesSinVenta] = useState("");
  const [topN, setTopN] = useState(20);
  const [error, setError] = useState("");
  const [tab, setTab] = useState("inicio");
  const [historial, setHistorial] = useState([]);
  /* Contexto que viaja entre pantallas: cuando se navega desde una tarjeta
     (Inicio, Acciones, Productos, Compras) hacia otra pantalla, este objeto
     lleva el codigo/sucursal ya seleccionado para que la pantalla destino
     no obligue a buscarlo de nuevo a mano. */
  const [focus, setFocus] = useState(null); // { codigo, sucursal }
  const irA = useCallback((destino, focoNuevo) => {
    if (focoNuevo !== undefined) setFocus(focoNuevo);
    setTab(destino);
  }, []);

  /* El contexto (codigo/sucursal) que llega en `focus` se aplica segun la
     pantalla destino, para que el usuario nunca tenga que volver a buscar
     algo que ya estaba viendo en otra pantalla. */
  useEffect(() => {
    if (!focus) return;
    if (tab === "productos") {
      setProductoDetalle({ codigo: focus.codigo, sucursal: focus.sucursal });
    } else if (tab === "sucursales") {
      setSucursalesCodigo(focus.codigo || "");
    } else if (tab === "compras") {
      setBusquedaCompras(focus.codigo || "");
      if (focus.sucursal) setSucursalFiltro(focus.sucursal);
    } else if (tab === "precios") {
      setPrecioDetalle({ codigo: focus.codigo, sucursal: focus.sucursal });
    } else if (tab === "acciones" && focus.codigo) {
      setSituacionAbierta(`${focus.codigo}|${focus.sucursal}`);
    }
  }, [tab, focus]);
  const [productoDetalle, setProductoDetalle] = useState(null); // { codigo, sucursal } | null
  const [situacionAbierta, setSituacionAbierta] = useState(null); // key | null
  const [filtroAccionTipo, setFiltroAccionTipo] = useState("todos");
  const [tiersAbiertos, setTiersAbiertos] = useState({ 1: false, 2: false });
  const [sucursalesCodigo, setSucursalesCodigo] = useState("");
  const [datosAbierto, setDatosAbierto] = useState(false);
  const [confirmPendiente, setConfirmPendiente] = useState(null); // { tipo: "archivo"|"historial", file?, id? }
  const [masFiltros, setMasFiltros] = useState(false);
  const [busquedaCompras, setBusquedaCompras] = useState("");
  const [compraExpandida, setCompraExpandida] = useState(null); // key "codigo|sucursal" | null
  const [busquedaPreciosCodigo, setBusquedaPreciosCodigo] = useState("");
  const [busquedaPreciosDescripcion, setBusquedaPreciosDescripcion] = useState("");
  const [precioDetalle, setPrecioDetalle] = useState(null); // { codigo, sucursal } | null
  const [guardando, setGuardando] = useState(false);
  const [reportModal, setReportModal] = useState(false);
  const [reportOrigen, setReportOrigen] = useState("productos"); // "productos" | "acciones"
  const [reportVista, setReportVista] = useState("actual");
  const [reportFormato, setReportFormato] = useState("pdf");
  const [correoDestino, setCorreoDestino] = useState("");
  const [correoProveedor, setCorreoProveedor] = useState("gmail");
  const [moneda, setMoneda] = useState("₡");
  const [previewMode, setPreviewMode] = useState(false);
  const [previewFilas, setPreviewFilas] = useState([]);
  const [previewVista, setPreviewVista] = useState("capital");
  const [theme, setTheme] = useState("light");
  const [descuentoSimulado, setDescuentoSimulado] = useState(30);
  const [simuladorAbierto, setSimuladorAbierto] = useState(false);
  const [ordenCompras, setOrdenCompras] = useState("reciente");
  const auth = DS.useSupabaseAuth(supabaseClient);

  useEffect(() => {
    document.documentElement.classList.toggle("dark", theme === "dark");
  }, [theme]);

  const supabaseListo = !!supabaseClient;

  const cargarHistorial = useCallback(async () => {
    if (!supabaseClient) return;
    const { data, error } = await supabaseClient
      .schema("pegas")
      .from("uploads")
      .select("id, created_at, nombre_archivo, filas")
      .order("created_at", { ascending: false })
      .limit(30);
    if (!error) setHistorial(data || []);
  }, []);

  useEffect(() => {
    if (datosAbierto) cargarHistorial();
  }, [datosAbierto, cargarHistorial]);

  /* Procesa el archivo de verdad -- exactamente la misma deteccion de
     formato, hojas de sucursal y correcciones existentes de siempre.
     Separado de handleFile solo para poder anteponer una confirmacion
     cuando ya hay datos reales activos (ver handleFile mas abajo); el
     procesamiento en si no cambia en absoluto. */
  const procesarArchivoReal = useCallback((file) => {
    setError("");
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = new Uint8Array(evt.target.result);
        const wb = XLSX.read(data, { type: "array", cellDates: true });

        const nombresHojas = wb.SheetNames;
        const hojasSucursal = nombresHojas.filter((n) =>
          SUCURSALES_ESPERADAS.includes(n.trim().toUpperCase())
        );
        if (!hojasSucursal.length) {
          setError(`No encontre hojas llamadas ${SUCURSALES_ESPERADAS.join(", ")}. Hojas en el archivo: ${nombresHojas.join(", ")}`);
          return;
        }

        const hojaLookup = nombresHojas.find((n) => normalizeHeader(n).includes("codigos"));
        let marginLookup = {};
        if (hojaLookup) {
          const rowsLookup = XLSX.utils.sheet_to_json(wb.Sheets[hojaLookup], { header: 1, raw: true });
          marginLookup = parseMarginLookup(rowsLookup);
        }

        let parsedTotal = [];
        let simboloDetectado = null;
        for (const nombreHoja of hojasSucursal) {
          const sheet = wb.Sheets[nombreHoja];
          const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true });
          const sucursalLabel = nombreHoja.trim().toUpperCase();
          const parsedHoja = parseSucursalSheet(rows, sucursalLabel, marginLookup);
          parsedTotal = parsedTotal.concat(parsedHoja);

          if (!simboloDetectado) {
            const rowsFormateadas = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false });
            const idx = buildColumnIndex(rows[0] || []);
            simboloDetectado = detectCurrencySymbol(rowsFormateadas, idx);
          }
        }

        if (!parsedTotal.length) {
          setError("No se encontraron filas con codigo valido en ninguna hoja de sucursal.");
          return;
        }

        setMoneda(simboloDetectado || "₡");
        setParsedRaw(parsedTotal);
        setUsingSample(false);
        setFileName(`${file.name} (${hojasSucursal.join(", ")})`);
        setSucursalFiltro("Todas");
        setDatosAbierto(false);
        irA("inicio");
      } catch (err) {
        setError("No se pudo leer el archivo: " + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }, [irA]);

  /* Antes de reemplazar datos activos reales (no los de ejemplo), pide
     confirmacion -- salvaguarda de interfaz, no cambia como se procesa el
     archivo. Si no hay datos reales que perder, procesa directo. */
  const handleFile = useCallback((e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (!usingSample) {
      setConfirmPendiente({ tipo: "archivo", file });
    } else {
      procesarArchivoReal(file);
    }
    e.target.value = "";
  }, [usingSample, procesarArchivoReal]);

  const guardarEnHistorial = useCallback(async () => {
    if (!supabaseClient) {
      setError("Supabase no esta configurado todavia en este archivo.");
      return;
    }
    setGuardando(true);
    const { error } = await supabaseClient.schema("pegas").from("uploads").insert({
      nombre_archivo: fileName || "datos de ejemplo",
      filas: parsedRaw.length,
      data: parsedRaw,
    });
    setGuardando(false);
    if (error) setError("No se pudo guardar en el historial: " + error.message);
  }, [parsedRaw, fileName]);

  const restaurarDesdeHistorialReal = useCallback(async (id) => {
    if (!supabaseClient) return;
    const { data, error } = await supabaseClient.schema("pegas").from("uploads").select("data, nombre_archivo").eq("id", id).single();
    if (!error && data) {
      setError("");
      setParsedRaw(data.data);
      setFileName(data.nombre_archivo);
      setUsingSample(false);
      setDatosAbierto(false);
      irA("inicio");
    } else {
      // Antes esto fallaba en silencio: la pantalla no cambiaba y no se
      // explicaba por que. Ahora se muestra el mismo tipo de mensaje que
      // ya usan las demas operaciones de Supabase de la app.
      setError("No se pudo restaurar esa carga desde el historial" + (error ? ": " + error.message : "."));
    }
  }, [irA]);

  /* Misma salvaguarda que en la carga de un archivo nuevo: si ya hay datos
     reales activos, confirmar antes de reemplazarlos. */
  const cargarDesdeHistorial = useCallback((id) => {
    if (!usingSample) {
      setConfirmPendiente({ tipo: "historial", id });
    } else {
      restaurarDesdeHistorialReal(id);
    }
  }, [usingSample, restaurarDesdeHistorialReal]);

  const enriched = useMemo(() => withScore(enrich(parsedRaw)), [parsedRaw]);

  const sucursales = useMemo(() => {
    const set = new Set(enriched.map((r) => r.sucursal));
    return ["Todas", ...Array.from(set).sort()];
  }, [enriched]);

  const filtered = useMemo(() => enriched.filter((r) =>
    (sucursalFiltro === "Todas" || r.sucursal === sucursalFiltro) &&
    coincideCampo(busquedaCodigo, r.codigo, 1) &&
    coincideCampo(busquedaDescripcion, r.descripcion) &&
    coincideNumero(busquedaMargen, r.margen).ok &&
    coincideNumero(busquedaMesesSinVenta, r.mesesSinVenta).ok
  ), [enriched, sucursalFiltro, busquedaCodigo, busquedaDescripcion, busquedaMargen, busquedaMesesSinVenta]);

  /* Cantidad y fecha de la ultima compra ya vienen del Excel real; aqui se
     interpreta la fecha, se calcula cuanto capital representa esa compra y
     -- el valor agregado -- para cuantos meses alcanza esa cantidad al ritmo
     de venta actual del producto. Mas de 6 meses de cobertura es candidato a
     posible sobre-compra: se compro mas de lo que el producto rota. */
  const ultimasCompras = useMemo(() => {
    return filtered
      .map(enriquecerCompra)
      .filter((r) => r.cantidadUltimaCompra > 0 || r.fechaCompraParsed)
      .sort((a, b) => {
        if (ordenCompras === "capital") return b.capitalCompra - a.capitalCompra;
        if (ordenCompras === "cantidad") return (b.cantidadUltimaCompra || 0) - (a.cantidadUltimaCompra || 0);
        if (ordenCompras === "sobrecompra") return (b.mesesQueAlcanza ?? -1) - (a.mesesQueAlcanza ?? -1);
        const ta = a.fechaCompraParsed ? a.fechaCompraParsed.getTime() : -Infinity;
        const tb = b.fechaCompraParsed ? b.fechaCompraParsed.getTime() : -Infinity;
        return tb - ta;
      });
  }, [filtered, ordenCompras]);

  /* Version global (todo el inventario, no solo el filtro activo de esta
     sesion) para que Acciones e Inicio detecten sobrecompras en toda la
     empresa, sin depender de que sucursal haya quedado seleccionada en
     Compras o Productos. Mismo calculo, mismo umbral, distinto alcance. */
  const comprasGlobal = useMemo(() =>
    enriched.map(enriquecerCompra).filter((r) => r.cantidadUltimaCompra > 0 || r.fechaCompraParsed),
  [enriched]);

  const buscando = !!(busquedaCodigo.trim() || busquedaDescripcion.trim() || busquedaMargen.trim() || busquedaMesesSinVenta.trim());

  const sorted = useMemo(() => {
    const copy = [...filtered];
    if (buscando) {
      // Lo mas cercano a lo que se escribio va primero (exacto, luego "empieza
      // igual", luego "lo contiene", y hasta el final lo que solo matchea por
      // tolerancia de tipeo/cercania numerica). Alfanumerico real solo como
      // desempate dentro del mismo nivel de cercania.
      const campo = (busquedaDescripcion.trim() && !busquedaCodigo.trim()) ? "descripcion" : "codigo";
      copy.sort((a, b) => {
        const ra = rangoCoincidencia(busquedaCodigo, a.codigo) + rangoCoincidencia(busquedaDescripcion, a.descripcion);
        const rb = rangoCoincidencia(busquedaCodigo, b.codigo) + rangoCoincidencia(busquedaDescripcion, b.descripcion);
        if (ra !== rb) return ra - rb;
        const da = coincideNumero(busquedaMargen, a.margen).distancia + coincideNumero(busquedaMesesSinVenta, a.mesesSinVenta).distancia;
        const db = coincideNumero(busquedaMargen, b.margen).distancia + coincideNumero(busquedaMesesSinVenta, b.mesesSinVenta).distancia;
        if (da !== db) return da - db;
        return String(a[campo]).localeCompare(String(b[campo]), "es", { numeric: true, sensitivity: "base" });
      });
    } else if (view === "capital") copy.sort((a, b) => b.capitalAtrapado - a.capitalAtrapado);
    else if (view === "utilidad") copy.sort((a, b) => b.utilidadTotal - a.utilidadTotal);
    else copy.sort((a, b) => b.score - a.score);
    // Si hay busqueda activa, el usuario quiere ver SUS resultados, no solo
    // el top N por score/capital — se muestran todos (con un techo razonable).
    return buscando ? copy.slice(0, 200) : copy.slice(0, topN);
  }, [filtered, view, topN, buscando, busquedaCodigo, busquedaDescripcion, busquedaMargen, busquedaMesesSinVenta]);

  /* "Pegas criticas" = Grupo A, sobre TODO el inventario (no solo el
     filtro/topN activo en Productos) -- esta lista alimenta Acciones e
     Inicio, que deben responder "como estamos" a nivel de toda la empresa.
     Mismo umbral de Grupo A que ya existia (grupoCalculado, score >= 0.66),
     solo se cambio el alcance de "filtrado + topN" a "todo el inventario". */
  const estrategiaLista = useMemo(() =>
    enriched.filter((r) => grupoCalculado(r.score) === "A").sort((a, b) => b.score - a.score),
  [enriched]);

  /* Producto de mayor rotacion por sucursal: candidato natural para armar
     combos ("lleve X con Y") sin inventar nada, sale de los datos reales. */
  const topSellerPorSucursal = useMemo(() => {
    const map = {};
    for (const r of enriched) {
      if (!map[r.sucursal] || (r.ventaPromedio || 0) > map[r.sucursal].ventaPromedio) {
        map[r.sucursal] = { codigo: r.codigo, descripcion: r.descripcion, ventaPromedio: r.ventaPromedio || 0 };
      }
    }
    return map;
  }, [enriched]);

  /* Mejor sucursal (por venta promedio) para cada codigo: si el mismo
     producto vende bien en otra sucursal, la mejor jugada puede ser
     trasladar stock en vez de descontar. */
  const mejorSucursalPorCodigo = useMemo(() => {
    const map = {};
    for (const r of enriched) {
      if (!map[r.codigo] || (r.ventaPromedio || 0) > map[r.codigo].ventaPromedio) {
        map[r.codigo] = { sucursal: r.sucursal, ventaPromedio: r.ventaPromedio || 0 };
      }
    }
    return map;
  }, [enriched]);

  /* Quiebre de stock alimenta Acciones/Inicio, que deben responder "como
     estamos" a nivel de toda la empresa, sin depender de que sucursal haya
     quedado seleccionada en Productos -- por eso se calculan sobre
     `enriched` (todo el inventario), no sobre `filtered`. Misma condicion,
     mismo umbral de 2 meses que ya existia. */
  const quiebreYaAgotado = useMemo(() =>
    enriched.filter((r) => r.stock === 0 && r.ventaPromedio > 0).sort((a, b) => b.ventaPromedio - a.ventaPromedio),
  [enriched]);

  const quiebrePorAgotarse = useMemo(() =>
    enriched.filter((r) => r.stock > 0 && r.mesesInventario !== null && r.mesesInventario < 2)
      .sort((a, b) => a.mesesInventario - b.mesesInventario),
  [enriched]);

  /* Bandeja unificada de Acciones. NO se inventa un score comun entre
     pegas/quiebres/sobrecompras -- cada categoria clasifica su propia
     severidad con sus propios umbrales ya existentes:
       - Pegas: siempre Grupo A (por definicion de esta lista) -> Atencion inmediata
       - Quiebre ya agotado -> Atencion inmediata; por agotarse en <1 mes -> Revisar pronto; 1-2 meses -> Monitorear
       - Sobrecompra: >9 meses de cobertura -> Revisar pronto; 6-9 meses -> Monitorear (umbral de 6 sin cambios)
     Un mismo codigo+sucursal en mas de una categoria se combina en una
     sola situacion (nunca tarjetas duplicadas), con la severidad mas alta
     entre las categorias que le apliquen. */
  const situaciones = useMemo(() => {
    const ctx = { topSellerPorSucursal, mejorSucursalPorCodigo, moneda };
    const map = {};
    function ensure(r) {
      const key = `${r.codigo}|${r.sucursal}`;
      if (!map[key]) map[key] = { key, codigo: r.codigo, descripcion: r.descripcion, sucursal: r.sucursal, stock: r.stock, categorias: [], severidadRank: 3 };
      return map[key];
    }
    for (const r of estrategiaLista) {
      const est = estrategiaAvanzada(r, ctx);
      const s = ensure(r);
      s.categorias.push({ tipo: "pega", rank: 0, r, est });
      s.severidadRank = Math.min(s.severidadRank, 0);
    }
    for (const r of quiebreYaAgotado) {
      const s = ensure(r);
      s.categorias.push({ tipo: "quiebre_agotado", rank: 0, r });
      s.severidadRank = Math.min(s.severidadRank, 0);
    }
    for (const r of quiebrePorAgotarse) {
      const rank = r.mesesInventario < 1 ? 1 : 2;
      const s = ensure(r);
      s.categorias.push({ tipo: "quiebre_por_agotarse", rank, r });
      s.severidadRank = Math.min(s.severidadRank, rank);
    }
    for (const r of comprasGlobal) {
      if (r.mesesQueAlcanza == null || r.mesesQueAlcanza <= UMBRAL_SOBRECOMPRA_MESES) continue;
      const rank = r.mesesQueAlcanza > 9 ? 1 : 2;
      const s = ensure(r);
      s.categorias.push({ tipo: "sobrecompra", rank, r });
      s.severidadRank = Math.min(s.severidadRank, rank);
    }
    const lista = Object.values(map);
    /* Orden: primero por severidad. Dentro del mismo nivel, por capital
       cuando existe un monto comparable (pega o sobrecompra); si la unica
       categoria presente es quiebre (sin monto equivalente calculado hoy),
       se ordena por venta promedio -- nunca se mezclan ambos criterios
       numericamente. */
    function impacto(s) {
      const pega = s.categorias.find((c) => c.tipo === "pega");
      if (pega) return { tipo: 1, valor: pega.r.capitalAtrapado };
      const sobre = s.categorias.find((c) => c.tipo === "sobrecompra");
      if (sobre) return { tipo: 1, valor: sobre.r.capitalCompra };
      const q = s.categorias.find((c) => c.tipo.startsWith("quiebre"));
      return { tipo: 0, valor: q ? (q.r.ventaPromedio || 0) : 0 };
    }
    lista.sort((a, b) => {
      if (a.severidadRank !== b.severidadRank) return a.severidadRank - b.severidadRank;
      const ia = impacto(a), ib = impacto(b);
      if (ia.tipo !== ib.tipo) return ib.tipo - ia.tipo;
      return ib.valor - ia.valor;
    });
    return lista;
  }, [estrategiaLista, quiebreYaAgotado, quiebrePorAgotarse, comprasGlobal, topSellerPorSucursal, mejorSucursalPorCodigo, moneda]);

  const resumenSituaciones = useMemo(() => {
    let capitalComparable = 0;
    let pegas = 0, quiebres = 0, sobrecompras = 0;
    for (const s of situaciones) {
      if (s.categorias.some((c) => c.tipo === "pega")) { pegas++; capitalComparable += s.categorias.find((c) => c.tipo === "pega").r.capitalAtrapado; }
      if (s.categorias.some((c) => c.tipo.startsWith("quiebre"))) quiebres++;
      if (s.categorias.some((c) => c.tipo === "sobrecompra")) { sobrecompras++; capitalComparable += s.categorias.find((c) => c.tipo === "sobrecompra").r.capitalCompra; }
    }
    return { total: situaciones.length, pegas, quiebres, sobrecompras, capitalComparable };
  }, [situaciones]);

  const compararSucursales = useMemo(() => {
    const map = {};
    for (const r of enriched) {
      if (!map[r.codigo]) map[r.codigo] = { codigo: r.codigo, descripcion: r.descripcion, porSucursal: {} };
      map[r.codigo].porSucursal[r.sucursal] = r;
    }
    const multi = Object.values(map).filter((g) => Object.keys(g.porSucursal).length >= 2);
    return multi.map((g) => {
      const ventas = Object.values(g.porSucursal).map((r) => r.ventaPromedio);
      return { ...g, gap: Math.max(...ventas) - Math.min(...ventas) };
    }).sort((a, b) => b.gap - a.gap).slice(0, topN);
  }, [enriched, topN]);

  const resumenPorSucursal = useMemo(() => {
    const map = {};
    for (const r of enriched) {
      if (!map[r.sucursal]) map[r.sucursal] = { sucursal: r.sucursal, capitalPegas: 0, utilidadTotal: 0, countA: 0, countB: 0, countC: 0 };
      const g = grupoCalculado(r.score);
      map[r.sucursal].utilidadTotal += r.utilidadTotal;
      if (g === "A") { map[r.sucursal].countA++; map[r.sucursal].capitalPegas += r.capitalAtrapado; }
      else if (g === "B") map[r.sucursal].countB++;
      else map[r.sucursal].countC++;
    }
    return Object.values(map);
  }, [enriched]);

  const totalesGlobales = useMemo(() => resumenPorSucursal.reduce((acc, s) => ({
    capitalPegas: acc.capitalPegas + s.capitalPegas,
    utilidadTotal: acc.utilidadTotal + s.utilidadTotal,
    countA: acc.countA + s.countA,
  }), { capitalPegas: 0, utilidadTotal: 0, countA: 0 }), [resumenPorSucursal]);

  const grupoAFiltrado = useMemo(() => filtered.filter((r) => grupoCalculado(r.score) === "A"), [filtered]);
  const simulacion = useMemo(() => ({
    count: grupoAFiltrado.length,
    capitalLiberado: grupoAFiltrado.reduce((s, r) => s + r.capitalAtrapado, 0),
    ingresoEstimado: grupoAFiltrado.reduce((s, r) => s + r.stock * r.precioSinImp * (1 - descuentoSimulado / 100), 0),
  }), [grupoAFiltrado, descuentoSimulado]);

  const totals = useMemo(() => ({
    capitalTotal: filtered.reduce((s, r) => s + r.capitalAtrapado, 0),
    capitalTop: sorted.reduce((s, r) => s + r.capitalAtrapado, 0),
    count: filtered.length,
  }), [filtered, sorted]);

  /* Cuando el reporte se abre desde Acciones, las filas exportables salen
     de `situaciones` (respetando el filtro rapido activo: Todos/Pegas/
     Quiebres/Sobrecompras), tomando la fila de producto ya existente
     (r) de cada situacion -- no se inventa ninguna columna nueva, es el
     mismo objeto que ya usan Productos y el PDF. Cuando se abre desde
     Productos, el comportamiento es exactamente el de siempre. */
  function calcularFilasReporte() {
    if (reportOrigen === "acciones") {
      const situacionesFiltradas = situaciones.filter((s) => {
        if (filtroAccionTipo === "todos") return true;
        if (filtroAccionTipo === "pegas") return s.categorias.some((c) => c.tipo === "pega");
        if (filtroAccionTipo === "quiebres") return s.categorias.some((c) => c.tipo.startsWith("quiebre"));
        return s.categorias.some((c) => c.tipo === "sobrecompra");
      });
      const filas = situacionesFiltradas.map((s) => (s.categorias.find((c) => c.tipo === "pega") || s.categorias[0]).r);
      return { filas, usarVista: "acciones" };
    }
    const usarVista = reportVista === "actual" ? view : reportVista;
    const filas = usarVista === view ? sorted : (() => {
      const copy = [...filtered];
      if (usarVista === "capital") copy.sort((a, b) => b.capitalAtrapado - a.capitalAtrapado);
      else copy.sort((a, b) => b.score - a.score);
      return copy.slice(0, topN);
    })();
    return { filas, usarVista };
  }

  function verVistaPrevia() {
    const { filas, usarVista } = calcularFilasReporte();
    setPreviewFilas(filas);
    setPreviewVista(usarVista);
    setPreviewMode(true);
  }

  function confirmarDescarga() {
    const titulo = previewVista === "acciones" ? "Reporte - Situaciones en Acciones"
      : previewVista === "capital" ? "Reporte - Mayor capital atrapado"
      : "Reporte - Candidatos reales a pega";
    if (reportFormato === "pdf") exportPdf(previewFilas, previewVista, titulo, moneda);
    else exportExcel(previewFilas, previewVista, moneda);
  }

  function cerrarReporte() {
    setReportModal(false);
    setPreviewMode(false);
  }

  function abrirCorreo() {

    const cuerpo = "Buenas,\n\nAdjunto el reporte de productos de baja rotacion (pegas).\n\nSaludos.";
    const para = correoDestino || "";
    const proveedor = PROVEEDORES_CORREO[correoProveedor];
    if (!proveedor || !proveedor.url) {
      // "Otro / predeterminado": usa el mailto: del sistema, que respeta
      // lo que el usuario tenga configurado (Outlook de escritorio, etc).
      window.location.href = `mailto:${para}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
      return;
    }
    window.open(proveedor.url(para, asunto, cuerpo), "_blank", "noopener,noreferrer");
  }

  /* Navegacion principal: solo estas tres pasan al componente compartido

                <span className="text-sm">🟠 Riesgo de quiebre</span>
                <span className="text-sm text-stone-500">{quiebreYaAgotado.length} agotados + {quiebrePorAgotarse.length} por agotarse</span>

              <button onClick={() => { setFiltroAccionTipo("sobrecompras"); irA("acciones"); }} className="w-full text-left p-3 flex items-center justify-between hover:bg-stone-50 dark:hover:bg-stone-900">
                <span className="text-sm">🟡 Posibles sobrecompras</span>

              </button>

          </div>

          <div>
            <div className="flex items-center justify-between mb-2">
              <h2 className="text-xs font-medium text-stone-500 dark:text-stone-400 uppercase tracking-wide">Prioridad — revisar primero</h2>
              <button onClick={() => { setFiltroAccionTipo("todos"); irA("acciones"); }} className="text-xs text-blue-600 hover:underline">Ver todas →</button>
            </div>
            {situaciones.length === 0 ? (
              <p className="text-sm text-stone-400 border border-stone-200 dark:border-stone-800 rounded-lg p-4">Ninguna situacion requiere atencion en este momento.</p>
            ) : (
              <div className="space-y-2">
                {situaciones.slice(0, 5).map((s) => {

                  const quiebreA = s.categorias.find((c) => c.tipo === "quiebre_agotado");
                  const quiebreP = s.categorias.find((c) => c.tipo === "quiebre_por_agotarse");
                  const accion = pega ? pega.est.fases[0].acciones[0] : quiebreA ? "Reponer cuanto antes." : quiebreP ? "Programar reposicion pronto." : "Revisar la proxima orden de compra.";
                  const diagnostico = pega ? pega.est.diagnostico
                    : quiebreA ? "Vende activamente y esta sin stock."
                    : quiebreP ? `Quedan ${Math.round(quiebreP.r.mesesInventario * 10) / 10} meses de inventario.`
                    : `La ultima compra alcanza para ~${Math.round(sobre.r.mesesQueAlcanza * 10) / 10} meses.`;
                  return (
                    <button key={s.key} onClick={() => irA("acciones", { codigo: s.codigo, sucursal: s.sucursal })}

                      <p className="text-xs text-stone-500 mt-1">{diagnostico}</p>

                    </button>

              </div>

          </div>

          <div>
            <h2 className="text-xs font-medium text-stone-500 dark:text-stone-400 uppercase tracking-wide mb-2">Herramientas</h2>

              <button onClick={() => irA("productos")} className="px-3 py-2 border border-stone-300 dark:border-stone-700 rounded-lg text-sm hover:bg-stone-50 dark:hover:bg-stone-900">Productos</button>
              <button onClick={() => irA("acciones")} className="px-3 py-2 border border-stone-300 dark:border-stone-700 rounded-lg text-sm hover:bg-stone-50 dark:hover:bg-stone-900">Plan de accion</button>
              <button onClick={() => irA("sucursales")} className="px-3 py-2 border border-stone-300 dark:border-stone-700 rounded-lg text-sm hover:bg-stone-50 dark:hover:bg-stone-900">Sucursales</button>
              <button onClick={() => irA("compras")} className="px-3 py-2 border border-stone-300 dark:border-stone-700 rounded-lg text-sm hover:bg-stone-50 dark:hover:bg-stone-900">Compras</button>
            </div>
          </div>
        </div>

      ) : tab === "acciones" ? (
        <div className="space-y-4">
          <div className="flex items-center justify-between flex-wrap gap-2">
            <p className="text-sm text-stone-500 dark:text-stone-400 max-w-2xl">Bandeja de trabajo: pegas criticas, riesgo de quiebre y posibles sobrecompras, priorizadas juntas.</p>
            <DS.Button theme={THEME} variant="primary" onClick={() => { setReportOrigen("acciones"); setReportModal(true); }}>Generar reporte</DS.Button>
          </div>

          <div className="border border-stone-200 dark:border-stone-800 rounded-lg p-3 bg-stone-50 dark:bg-stone-900/50 space-y-1.5">
            <div className="flex items-center justify-between flex-wrap gap-2">
              <p className="text-sm font-medium text-stone-900 dark:text-stone-50">{resumenSituaciones.total} situaciones requieren atencion</p>
              <p className="text-sm text-stone-600 dark:text-stone-300">Impacto comparable: {money(resumenSituaciones.capitalComparable, moneda)}</p>
            </div>
            <p className="text-xs text-stone-400">{resumenSituaciones.pegas} pegas · {resumenSituaciones.sobrecompras} sobrecompras · {resumenSituaciones.quiebres} quiebres (sin monto comparable)</p>
          </div>

          <div className="flex flex-wrap gap-2">
            {[["todos", "Todos"], ["pegas", "Pegas"], ["quiebres", "Quiebres"], ["sobrecompras", "Sobrecompras"]].map(([id, label]) => (
              <button key={id} onClick={() => setFiltroAccionTipo(id)}
                className={`px-3 py-1.5 rounded-lg text-sm border ${filtroAccionTipo === id ? "bg-blue-600 text-white border-blue-600" : "border-stone-300 dark:border-stone-700 text-stone-600 dark:text-stone-300"}`}>
                {label}
              </button>
            ))}
          </div>

          {(() => {
            const filtradas = situaciones.filter((s) => {
              if (filtroAccionTipo === "todos") return true;
              if (filtroAccionTipo === "pegas") return s.categorias.some((c) => c.tipo === "pega");
              if (filtroAccionTipo === "quiebres") return s.categorias.some((c) => c.tipo.startsWith("quiebre"));
              return s.categorias.some((c) => c.tipo === "sobrecompra");
            });
            if (filtradas.length === 0) {

            const NIVELES = [

            return NIVELES.map(({ rank, label, icon }) => {

              // "Atencion inmediata" usa el mismo Top N ya existente en la

              // elimina ningun caso: el resto sigue disponible con "Ver todas".
              const visibles = rank === 0 && !tiersAbiertos[0] ? grupo.slice(0, topN) : grupo;
              return (

                  <button onClick={() => rank !== 0 && setTiersAbiertos((p) => ({ ...p, [rank]: !p[rank] }))}
                    className="w-full flex items-center justify-between text-sm font-medium text-stone-700 dark:text-stone-300">
                    <span>{icon} {label} ({grupo.length})</span>

              {Object.entries(PROVEEDORES_CORREO).map(([key, p]) => (
                <button key={key} type="button" onClick={() => setCorreoProveedor(key)}
                  className={`px-3 py-1.5 rounded-lg text-sm border ${correoProveedor === key ? "bg-blue-600 text-white border-blue-600" : "border-stone-300 dark:border-stone-700 text-stone-600 dark:text-stone-300"}`}>
                  {p.label}
                </button>
              ))}
            </div>
            <p className="text-xs text-stone-400 mt-1">
              Se abrira una pestana con el correo ya redactado (destinatario, asunto y mensaje). El archivo se adjunta a mano despues de descargarlo.
            </p>
          </DS.Field>

          <div className="flex gap-2 pt-2">
            <DS.Button theme={THEME} variant="primary" className="flex-1" onClick={verVistaPrevia}>
              Ver vista previa
            </DS.Button>
          </div>
          <button onClick={cerrarReporte} className="w-full text-xs text-stone-400 hover:text-stone-300 pt-1">
            Cancelar
          </button>
        </DS.Modal>
      )}

      {reportModal && previewMode && (
        <DS.Modal maxWidth="max-w-3xl" bodyClassName="space-y-3 flex flex-col max-h-[85vh]">
          <div className="flex items-center justify-between">
            <h2 className={DS.TYPE.sectionTitle}>
              Vista previa - {previewVista === "acciones" ? "Situaciones en Acciones" : previewVista === "capital" ? "Mayor capital atrapado" : "Candidatos reales a pega"}
            </h2>
            <button onClick={() => setPreviewMode(false)} className="text-xs text-stone-400 hover:text-stone-300">
              Volver a opciones
            </button>
          </div>

          {reportFormato === "pdf" && (
            <p className="text-xs text-amber-700 dark:text-amber-400 bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 rounded-lg px-3 py-2">
              La vista previa del PDF en el celular se muestra como tabla (el visor de PDF dentro del navegador no es confiable en Android). El archivo descargado sí sera un PDF real con este mismo contenido.
            </p>
          )}
            <div className="overflow-auto border border-stone-200 dark:border-stone-800 rounded-lg flex-1">
              <table className="w-full text-sm">
                <thead className="bg-stone-50 dark:bg-stone-900 text-stone-500 dark:text-stone-400 text-xs uppercase tracking-wide sticky top-0">
                  <tr>
                    <th className="text-left px-3 py-2 font-medium">Codigo</th>
                    <th className="text-left px-3 py-2 font-medium">Descripcion</th>
                    <th className="text-left px-3 py-2 font-medium">Sucursal</th>
                    <th className="text-center px-3 py-2 font-medium">Grupo</th>
                    <th className="text-right px-3 py-2 font-medium">Stock</th>
                    <th className="text-right px-3 py-2 font-medium">Capital atrapado</th>
                    <th className="text-right px-3 py-2 font-medium">Meses sin venta</th>
                    <th className="text-right px-3 py-2 font-medium">Prom. venta mensual</th>
                    <th className="text-right px-3 py-2 font-medium">Margen</th>
                    {(previewVista === "pega" || previewVista === "acciones") && <th className="text-right px-3 py-2 font-medium">Score</th>}
                  </tr>
                </thead>
                <tbody>
                  {previewFilas.map((r, i) => (
                    <tr key={`${r.codigo}-${i}`} className="border-t border-stone-100 dark:border-stone-800">
                      <td className="px-3 py-2 font-medium">{r.codigo}</td>
                      <td className="px-3 py-2 text-stone-600 dark:text-stone-300">{r.descripcion}</td>
                      <td className="px-3 py-2 text-stone-600 dark:text-stone-300">{r.sucursal}</td>
                      <td className="px-3 py-2 text-center">
                        <DS.GroupBadge grupo={grupoCalculado(r.score)} />
                      </td>
                      <td className="px-3 py-2 text-right">{r.stock}</td>
                      <td className="px-3 py-2 text-right font-medium">{money(r.capitalAtrapado, moneda)}</td>
                      <td className="px-3 py-2 text-right">{r.mesesSinVenta ?? "-"}</td>
                      <td className="px-3 py-2 text-right">{r.ventaPromedio ?? "-"}</td>
                      <td className="px-3 py-2 text-right">{r.margen}%</td>
                      {(previewVista === "pega" || previewVista === "acciones") && (
                        <td className="px-3 py-2 text-right">
                          <DS.ScoreBadge score={r.score} />
                        </td>
                      )}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            <div className="flex gap-2 pt-1">
              <DS.Button theme={THEME} variant="secondary" className="flex-1" onClick={confirmarDescarga}>
                Descargar {reportFormato === "pdf" ? "PDF" : "Excel"}
              </DS.Button>
              <DS.Button theme={THEME} variant="outline" className="flex-1" onClick={abrirCorreo}>
                Abrir correo
              </DS.Button>
              <DS.Button theme={THEME} variant="outline" onClick={cerrarReporte}>
                Cerrar
              </DS.Button>
            </div>
            <p className="text-xs text-stone-400">
              Revisa la vista previa antes de descargar. El boton "Abrir correo" abre {PROVEEDORES_CORREO[correoProveedor].label} con el mensaje ya redactado;
              el archivo lo adjuntas manualmente despues de descargarlo (ningun navegador permite adjuntar automaticamente por seguridad).
            </p>
        </DS.Modal>
      )}

      {confirmPendiente && (
        <DS.Modal>
          <h2 className={DS.TYPE.sectionTitle}>Reemplazar datos actuales</h2>
          <p className="text-sm text-stone-600 dark:text-stone-300">
            Esto reemplazara los datos activos ahora mismo ({fileName || "datos de ejemplo"}, {parsedRaw.length} filas). Si no los has guardado en historial, se perderan.
          </p>
          <div className="flex gap-2 justify-end">
            <DS.Button theme={THEME} variant="outline" onClick={() => setConfirmPendiente(null)}>Cancelar</DS.Button>
            <DS.Button theme={THEME} variant="primary" onClick={() => {
              if (confirmPendiente.tipo === "archivo") procesarArchivoReal(confirmPendiente.file);
              else restaurarDesdeHistorialReal(confirmPendiente.id);
              setConfirmPendiente(null);
            }}>Continuar</DS.Button>
          </div>
        </DS.Modal>
      )}

      {productoDetalle && (() => {
        const r = enriched.find((x) => x.codigo === productoDetalle.codigo && x.sucursal === productoDetalle.sucursal);
        if (!r) return (
          <DS.Modal>
            <p className="text-sm text-stone-500">No se encontro ese producto en los datos actuales.</p>
            <DS.Button theme={THEME} variant="outline" onClick={() => setProductoDetalle(null)}>Cerrar</DS.Button>
          </DS.Modal>
        );
        const ctx = { topSellerPorSucursal, mejorSucursalPorCodigo, moneda };
        const esGrupoA = grupoCalculado(r.score) === "A";
        const est = esGrupoA ? estrategiaAvanzada(r, ctx) : null;
        const compra = enriquecerCompra(r);
        const tieneCompra = compra.cantidadUltimaCompra > 0 || compra.fechaCompraParsed;
        const otrasSucursales = enriched.filter((x) => x.codigo === r.codigo && x.sucursal !== r.sucursal);
        return (
          <DS.Modal maxWidth="max-w-xl" bodyClassName="space-y-4 max-h-[85vh] overflow-y-auto">
            <div>
              <p className="text-xs text-stone-400">{r.codigo} · {r.sucursal} · <DS.GroupBadge grupo={grupoCalculado(r.score)} /></p>
              <h2 className={DS.TYPE.sectionTitle}>{r.descripcion}</h2>
            </div>

            <div>
              <p className="text-xs font-medium text-stone-500 uppercase tracking-wide mb-1">Inventario</p>
              <div className="grid grid-cols-2 gap-2 text-sm">
                <p>Stock: <span className="font-medium">{r.stock}</span></p>
                <p>Costo: <span className="font-medium">{money(r.costo, moneda)}</span></p>
                <p>Precio sin imp.: <span className="font-medium">{money(r.precioSinImp, moneda)}</span></p>
                <p>Margen: <span className="font-medium">{r.margen}%</span></p>
                <p className="col-span-2">Capital atrapado: <span className="font-medium">{money(r.capitalAtrapado, moneda)}</span></p>
              </div>
            </div>

            <div>
              <p className="text-xs font-medium text-stone-500 uppercase tracking-wide mb-1">Ventas</p>
              <div className="grid grid-cols-2 gap-2 text-sm">
                <p>Prom. mensual: <span className="font-medium">{r.ventaPromedio} u/mes</span></p>
                <p>Meses sin venta: <span className="font-medium">{r.mesesSinVenta}</span></p>
                <p className="col-span-2">Tendencia: <span className="font-medium">{{ nunca_vendio: "Nunca vendio", declive: "En declive reciente", creciendo: "Creciendo", estable: "Estable" }[r.tendencia]}</span></p>
              </div>
            </div>

            {est && (
              <div>
                <p className="text-xs font-medium text-stone-500 uppercase tracking-wide mb-1">Estrategia</p>
                <p className="text-sm text-stone-600 dark:text-stone-300">{est.diagnostico}</p>
                <button onClick={() => { setProductoDetalle(null); irA("acciones", { codigo: r.codigo, sucursal: r.sucursal }); }}
                  className="text-xs text-blue-600 hover:underline mt-1">Ver plan de accion completo →</button>
              </div>
            )}

            {tieneCompra && (
              <div>
                <p className="text-xs font-medium text-stone-500 uppercase tracking-wide mb-1">Compras</p>
                <p className="text-sm text-stone-600 dark:text-stone-300">
                  Ultima compra: {compra.cantidadUltimaCompra || "No disponible"} unidades{compra.fechaCompraParsed ? `, ${compra.fechaCompraParsed.toLocaleDateString("es-CR")}` : ""}
                </p>
                <button onClick={() => { setProductoDetalle(null); irA("compras", { codigo: r.codigo, sucursal: r.sucursal }); }}
                  className="text-xs text-blue-600 hover:underline mt-1">Ver en Compras →</button>
              </div>
            )}

            {otrasSucursales.length > 0 && (
              <div>
                <p className="text-xs font-medium text-stone-500 uppercase tracking-wide mb-1">Sucursales</p>
                <p className="text-sm text-stone-600 dark:text-stone-300">Tambien existe en: {otrasSucursales.map((x) => x.sucursal).join(", ")}</p>
                <button onClick={() => { setProductoDetalle(null); irA("sucursales", { codigo: r.codigo, sucursal: r.sucursal }); }}
                  className="text-xs text-blue-600 hover:underline mt-1">Comparar entre sucursales →</button>
              </div>
            )}

            <div>
              <button onClick={() => { setProductoDetalle(null); irA("precios", { codigo: r.codigo, sucursal: r.sucursal }); }}
                className="text-xs text-blue-600 hover:underline">Ver precios →</button>
            </div>

            <div className="flex justify-end pt-2 border-t border-stone-200 dark:border-stone-800">
              <DS.Button theme={THEME} variant="outline" onClick={() => setProductoDetalle(null)}>Cerrar</DS.Button>
            </div>
          </DS.Modal>
        );
      })()}

      {precioDetalle && (() => {
        const filas = enriched.filter((x) => x.codigo === precioDetalle.codigo);
        if (filas.length === 0) return (
          <DS.Modal>
            <p className="text-sm text-stone-500">No se encontro ese producto en los datos actuales.</p>
            <DS.Button theme={THEME} variant="outline" onClick={() => setPrecioDetalle(null)}>Cerrar</DS.Button>
          </DS.Modal>
        );
        const sucursalOrigen = precioDetalle.sucursal && filas.some((x) => x.sucursal === precioDetalle.sucursal)
          ? precioDetalle.sucursal : filas[0].sucursal;
        return (
          <DS.Modal maxWidth="max-w-lg" bodyClassName="space-y-4">
            <div>
              <p className="text-xs text-stone-400">{filas[0].codigo}</p>
              <h2 className={DS.TYPE.sectionTitle}>{filas[0].descripcion}</h2>
            </div>
            <div>
              <p className="text-xs font-medium text-stone-500 uppercase tracking-wide mb-1">Valores comerciales por sucursal</p>
              <div className="space-y-2">
                {filas.map((f, i) => (
                  <div key={i} className="border border-stone-200 dark:border-stone-800 rounded-lg p-2.5 text-sm">
                    <p className="font-medium mb-1">{f.sucursal}</p>
                    <div className="grid grid-cols-2 gap-1 text-stone-600 dark:text-stone-300">
                      <p>Costo: {f.costoDisponible ? money(f.costo, moneda) : <span className="text-stone-400 italic">No disponible</span>}</p>
                      <p>Margen: {f.margen}%{f.margenEstimado && <span className="ml-1 text-xs text-amber-600 dark:text-amber-400">Estimado</span>}</p>
                      <p>Precio sin IVA: {f.precioSinImpDisponible ? money(f.precioSinImp, moneda) : <span className="text-stone-400 italic">No disponible</span>}</p>
                      <p>Precio con IVA: {f.precioConImpDisponible ? money(f.precioConImp, moneda) : <span className="text-stone-400 italic">No disponible</span>}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
            <div className="flex justify-between items-center pt-2 border-t border-stone-200 dark:border-stone-800">
              <button onClick={() => { setPrecioDetalle(null); irA("productos", { codigo: precioDetalle.codigo, sucursal: sucursalOrigen }); }}
                className="text-xs text-blue-600 hover:underline">Ver producto →</button>
              <DS.Button theme={THEME} variant="outline" onClick={() => setPrecioDetalle(null)}>Cerrar</DS.Button>
            </div>
          </DS.Modal>
        );
      })()}

      {datosAbierto && (
        <DS.Modal maxWidth="max-w-lg" bodyClassName="space-y-4 max-h-[85vh] overflow-y-auto">
          <div className="flex items-center justify-between">
            <h2 className={DS.TYPE.sectionTitle}>⚙ Datos</h2>
            <button onClick={() => setDatosAbierto(false)} className="text-stone-400 hover:text-stone-600"><DS.Icons.X size={16} /></button>
          </div>
          <p className="text-xs text-stone-400">Conectado como {auth.session?.user?.email || "-"}</p>

          <div>
            <p className="text-xs font-medium text-stone-500 uppercase tracking-wide mb-1">Datos actuales</p>
            <p className="text-sm text-stone-600 dark:text-stone-300">{usingSample ? "Datos de ejemplo" : fileName}</p>
            <p className="text-xs text-stone-400">{parsedRaw.length} filas</p>
          </div>

          <div>
            <label className="inline-flex items-center gap-2 px-3 py-2 border border-stone-300 dark:border-stone-700 rounded-lg text-sm cursor-pointer hover:bg-stone-50 dark:hover:bg-stone-900">
              Nueva carga
              <input type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={handleFile} />
            </label>
            <button onClick={guardarEnHistorial} disabled={guardando}
              className="ml-2 px-3 py-2 border border-emerald-300 text-emerald-700 rounded-lg text-sm hover:bg-emerald-50 disabled:opacity-50">
              {guardando ? "Guardando..." : "Guardar en historial"}
            </button>
            {error && <p className="text-sm text-red-600 mt-2">{error}</p>}
          </div>

          <div>
            <p className="text-xs font-medium text-stone-500 uppercase tracking-wide mb-1">Historial de cargas</p>
            <div className="border border-stone-200 dark:border-stone-800 rounded-lg divide-y divide-stone-100 dark:divide-stone-800 max-h-64 overflow-y-auto">
              {historial.length === 0 && (
                <p className="p-3 text-sm text-stone-400">No hay cargas guardadas todavia.</p>
              )}
              {historial.map((h) => (
                <div key={h.id} className="p-3 flex items-center justify-between text-sm">
                  <div>
                    <p className="font-medium">{h.nombre_archivo}</p>
                    <p className="text-stone-400 text-xs">{new Date(h.created_at).toLocaleString("es-CR")} · {h.filas} filas</p>
                  </div>
                  <button onClick={() => cargarDesdeHistorial(h.id)} className="px-2.5 py-1 text-xs border border-stone-300 rounded-lg hover:bg-stone-50">
                    Cargar
                  </button>
                </div>
              ))}
            </div>
          </div>
        </DS.Modal>
      )}
    </div>
  );
}

/* ====================== GATE DE AUTENTICACION ======================
   Decide QUE se muestra (login / cargando / sin acceso / la app) sin que
   App() tenga que hacer un return condicional entre sus propios hooks —
   eso rompe las reglas de hooks de React. App() se monta solo cuando ya
   hay sesion Y esa cuenta esta en la lista blanca de pegas.allowed_users
   (o cuando Supabase ni siquiera esta configurado todavia).

   Este chequeo de lista blanca es ademas de la RLS en la base de datos,
   no en vez de ella: la RLS es lo que de verdad protege los datos; esto
   solo evita que alguien con cuenta valida (pero sin permiso a Pegas)
   vea la pantalla de la app sin sentido. */
function AppGate() {
  const supabaseListo = !!supabaseClient;
  const auth = DS.useSupabaseAuth(supabaseClient);
  const [permitido, setPermitido] = useState(null); // null = sin chequear, true/false = resultado

  useEffect(() => {
    if (!supabaseListo || !auth.session) { setPermitido(null); return; }
    let cancelado = false;
    supabaseClient.schema("pegas").from("allowed_users").select("user_id").eq("user_id", auth.session.user.id).maybeSingle()
      .then(({ data }) => { if (!cancelado) setPermitido(!!data); })
      .catch(() => { if (!cancelado) setPermitido(false); });
    return () => { cancelado = true; };
  }, [supabaseListo, auth.session]);

  if (!supabaseListo) return <App />;
  if (auth.loading) {
    return <div className="min-h-screen grid place-items-center text-stone-400 text-sm">Cargando...</div>;
  }
  if (!auth.session) {
    return <DS.LoginScreen theme={THEME} onSubmit={auth.signIn} loading={auth.signingIn} error={auth.error} />;
  }
  if (permitido === null) {
    return <div className="min-h-screen grid place-items-center text-stone-400 text-sm">Verificando acceso...</div>;
  }
  if (!permitido) {
    return <DS.AccessDenied theme={THEME} userEmail={auth.session.user.email} onLogout={auth.signOut} />;
  }
  return <App />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<AppGate />);
</script>
</body>
