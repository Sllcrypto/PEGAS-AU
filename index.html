<script type="text/babel">
/* ============================================================
   SISTEMA DE DISEÑO COMPARTIDO — v1.0.0 (copia local, temporal)
   ============================================================
   Este bloque es identico al archivo /design-system/design-system.js
   que se entrega aparte. Vive aqui inline SOLO mientras no exista
   el repo de GitHub para el sistema compartido.

   MIGRACION PENDIENTE: en cuanto crees el repo y le pongas un tag
   (ej. v1.0.0), borra este bloque completo y reemplazalo por:

   <script type="text/babel" src="https://cdn.jsdelivr.net/gh/TU_USUARIO/design-system@v1.0.0/design-system.js"><\/script>

   Apunta SIEMPRE a un tag fijo, nunca a @main — un cambio futuro al
   sistema no debe poder romper una app de cliente ya en produccion
   sin que tu lo decidas explicitamente subiendo de version.

   Misma migracion aplica para Control Empresarial y futuras apps:
   todas cargan la MISMA url de tag para compartir el sistema.
   ============================================================ */

(function () {
  const { useState, useEffect } = React;

  /* ---------- ICONOS (SVGs vendorizados, sin dependencia externa) ---------- */
  /* Trazos basados en Lucide (ISC License). Copiados como componentes React
     livianos para evitar cargar la librería completa y evitar conflictos
     de Lucide manipulando el DOM por fuera de React. */

  function iconBase(paths, props) {
    const { size = 18, strokeWidth = 2, className = "", ...rest } = props || {};
    return (
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width={size} height={size} viewBox="0 0 24 24"
        fill="none" stroke="currentColor" strokeWidth={strokeWidth}
        strokeLinecap="round" strokeLinejoin="round"
        className={className} {...rest}
      >
        {paths}
      </svg>
    );
  }

  const Icons = {
    TrendingDown: (p) => iconBase(<><polyline points="22 17 13.5 8.5 8.5 13.5 2 7" /><polyline points="16 17 22 17 22 11" /></>, p),
    TrendingUp: (p) => iconBase(<><polyline points="22 7 13.5 15.5 8.5 10.5 2 17" /><polyline points="16 7 22 7 22 13" /></>, p),
    Ban: (p) => iconBase(<><circle cx="12" cy="12" r="10" /><line x1="4.9" y1="4.9" x2="19.1" y2="19.1" /></>, p),
    Minus: (p) => iconBase(<line x1="5" y1="12" x2="19" y2="12" />, p),
    Sun: (p) => iconBase(<><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" /></>, p),
    Moon: (p) => iconBase(<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />, p),
    Download: (p) => iconBase(<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></>, p),
    Mail: (p) => iconBase(<><rect x="2" y="4" width="20" height="16" rx="2" /><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" /></>, p),
    X: (p) => iconBase(<><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></>, p),
    ChevronDown: (p) => iconBase(<polyline points="6 9 12 15 18 9" />, p),
    Upload: (p) => iconBase(<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="17 8 12 3 7 8" /><line x1="12" y1="3" x2="12" y2="15" /></>, p),
    Save: (p) => iconBase(<><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z" /><polyline points="17 21 17 13 7 13 7 21" /><polyline points="7 3 7 8 15 8" /></>, p),
    AlertTriangle: (p) => iconBase(<><path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" /></>, p),
    History: (p) => iconBase(<><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><polyline points="3 3 3 8 8 8" /><polyline points="12 7 12 12 16 14" /></>, p),
    LogOut: (p) => iconBase(<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></>, p),
    Lock: (p) => iconBase(<><rect x="3" y="11" width="18" height="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></>, p),
    Search: (p) => iconBase(<><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></>, p),
  };

  /* ---------- TOKENS DE MARCA ---------- */
  /* Cada app pasa su propio THEME { primary, secondary, accent, name, logo }.
     Este helper traduce el tema a clases Tailwind consistentes en toda la
     familia de apps. Los valores válidos de color son nombres de paleta
     Tailwind (ej. "blue", "emerald", "violet", "rose", "amber", "cyan"). */
  function themeClasses(theme) {
    const p = theme?.primary || "blue";
    const s = theme?.secondary || "emerald";
    const a = theme?.accent || "violet";
    return {
      primary: p, secondary: s, accent: a,
      primaryBtn: `bg-${p}-600 hover:bg-${p}-700 text-white`,
      primaryBtnOutline: `border border-${p}-300 dark:border-${p}-800 text-${p}-700 dark:text-${p}-300`,
      secondaryBtn: `bg-${s}-600 hover:bg-${s}-700 text-white`,
      accentBtn: `bg-${a}-600 hover:bg-${a}-700 text-white`,
    };
  }

  /* ---------- COLORES SEMÁNTICOS DE RIESGO (fijos, NO se tematizan) ---------- */
  const RISK = {
    A: "bg-red-100 text-red-800 dark:bg-red-950/50 dark:text-red-300",
    B: "bg-amber-100 text-amber-800 dark:bg-amber-950/50 dark:text-amber-300",
    C: "bg-emerald-100 text-emerald-800 dark:bg-emerald-950/50 dark:text-emerald-300",
    score(score) {
      if (score >= 0.66) return "bg-red-100 text-red-700 dark:bg-red-950/50 dark:text-red-300";
      if (score >= 0.33) return "bg-amber-100 text-amber-700 dark:bg-amber-950/50 dark:text-amber-300";
      return "bg-emerald-100 text-emerald-700 dark:bg-emerald-950/50 dark:text-emerald-300";
    },
  };

  /* ---------- TIPOGRAFÍA Y ESPACIADO (escala fija, igual en toda la familia) ---------- */
  const TYPE = {
    pageTitle: "text-2xl font-semibold tracking-tight",
    pageSubtitle: "text-sm text-stone-500 dark:text-stone-400",
    sectionTitle: "font-medium text-stone-900 dark:text-stone-100",
    label: "text-xs text-stone-500 dark:text-stone-400",
    statValue: "text-xl font-medium",
    body: "text-sm text-stone-700 dark:text-stone-300",
  };
  const SPACING = {
    page: "px-4 py-4 md:px-6 md:py-6 max-w-6xl mx-auto",
    stackGap: "space-y-4",
    cardPad: "p-3",
    modalPad: "p-5",
  };

  /* ---------- COMPONENTES ---------- */

  /* Mapa de hex reales (shade 600) para los nombres de paleta Tailwind
     soportados como color de marca. Se usa solo para el degradado del
     header, que necesita valores CSS reales (no puede depender de que
     Tailwind genere una clase para eso). */
  const HEX600 = {
    slate: "#475569", gray: "#4b5563", zinc: "#52525b", neutral: "#525252", stone: "#57534e",
    red: "#dc2626", orange: "#ea580c", amber: "#d97706", yellow: "#ca8a04", lime: "#65a30d",
    green: "#16a34a", emerald: "#059669", teal: "#0d9488", cyan: "#0891b2", sky: "#0284c7",
    blue: "#2563eb", indigo: "#4f46e5", violet: "#7c3aed", purple: "#9333ea",
    fuchsia: "#c026d3", pink: "#db2777", rose: "#e11d48",
  };

  function AppHeader({ theme, tab, tabs, onTabChange, darkMode, onToggleDark, onLogout, userEmail }) {
    const tc = themeClasses(theme);
    const g1 = HEX600[tc.secondary] || "#059669";
    const g2 = HEX600[tc.primary] || "#2563eb";
    const g3 = HEX600[tc.accent] || "#7c3aed";
    return (
      <div className="mb-4">
        <div className="h-1 w-full rounded-full mb-3" style={{
          background: `linear-gradient(90deg, ${g1} 0%, ${g2} 50%, ${g3} 100%)`
        }} />
        <div className="flex items-start justify-between gap-3">
          <div className="flex items-center gap-3">
            {theme?.logo && <img src={theme.logo} alt={theme.name} className="w-9 h-9 rounded-lg object-contain" />}
            <div>
              <h1 className={TYPE.pageTitle}>{theme?.appTitle || "App"}</h1>
              <p className={TYPE.pageSubtitle}>{theme?.appSubtitle || ""}</p>
            </div>
          </div>
          {onLogout && (
            <button onClick={onLogout} title={userEmail ? `Salir (${userEmail})` : "Salir"}
              className="shrink-0 flex items-center gap-1.5 text-xs text-stone-400 hover:text-stone-600 dark:hover:text-stone-300 mt-1">
              <Icons.LogOut size={14} />
              <span className="hidden sm:inline">{userEmail || "Salir"}</span>
            </button>
          )}
        </div>
        <div className="flex items-center gap-2 overflow-x-auto mt-3 pb-1">
          {tabs.map((t) => (
            <button key={t.id} onClick={() => onTabChange(t.id)}
              className={`shrink-0 px-3 py-1.5 rounded-lg text-sm border ${tab === t.id
                ? `bg-${tc.primary}-600 text-white border-${tc.primary}-600`
                : "border-stone-300 dark:border-stone-700 text-stone-600 dark:text-stone-300"}`}>
              {t.label}
            </button>
          ))}
          <button onClick={onToggleDark}
            className="shrink-0 ml-auto w-9 h-9 grid place-items-center rounded-lg border border-stone-300 dark:border-stone-700 text-stone-600 dark:text-stone-300">
            {darkMode ? <Icons.Sun size={16} /> : <Icons.Moon size={16} />}
          </button>
        </div>
      </div>
    );
  }

  function StatCard({ label, value, tone = "primary", theme }) {
    const tc = themeClasses(theme);
    const colorMap = { primary: tc.primary, secondary: tc.secondary, accent: tc.accent, neutral: "stone" };
    const c = colorMap[tone] || tc.primary;
    return (
      <div className={`bg-${c}-50 dark:bg-${c}-950/40 rounded-lg ${SPACING.cardPad} border-l-2 border-${c}-500`}>
        <p className={`text-xs text-${c}-700 dark:text-${c}-400 mb-1`}>{label}</p>
        <p className={`${TYPE.statValue} text-${c}-900 dark:text-${c}-200`}>{value}</p>
      </div>
    );
  }

  function Button({ children, onClick, variant = "primary", theme, className = "", ...rest }) {
    const tc = themeClasses(theme);
    const variants = {
      primary: tc.primaryBtn,
      secondary: tc.secondaryBtn,
      accent: tc.accentBtn,
      outline: `border border-stone-300 dark:border-stone-700 text-stone-700 dark:text-stone-200 hover:bg-stone-50 dark:hover:bg-stone-800`,
      ghost: "text-stone-400 hover:text-stone-600 dark:hover:text-stone-300",
    };
    return (
      <button onClick={onClick} className={`px-3 py-2 rounded-lg text-sm ${variants[variant]} ${className}`} {...rest}>
        {children}
      </button>
    );
  }

  function GroupBadge({ grupo }) {
    return (
      <span className={`inline-block w-6 h-6 leading-6 text-center rounded-full text-xs font-semibold ${RISK[grupo] || RISK.C}`}>
        {grupo}
      </span>
    );
  }

  function ScoreBadge({ score }) {
    return (
      <span className={`inline-block px-2 py-0.5 rounded-full text-xs font-medium ${RISK.score(score)}`}>
        {Math.round(score * 100)}
      </span>
    );
  }

  function TrendIcon({ tendencia, size = 14 }) {
    const map = {
      nunca_vendio: <Icons.Ban size={size} className="text-red-500 inline" />,
      declive: <Icons.TrendingDown size={size} className="text-amber-500 inline" />,
      creciendo: <Icons.TrendingUp size={size} className="text-emerald-500 inline" />,
      estable: <Icons.Minus size={size} className="text-stone-400 inline" />,
    };
    return map[tendencia] || null;
  }

  function Modal({ children, maxWidth = "max-w-sm", bodyClassName = "space-y-4" }) {
    return (
      <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
        <div className={`bg-white dark:bg-stone-900 rounded-xl ${SPACING.modalPad} w-full ${maxWidth} ${bodyClassName}`}>
          {children}
        </div>
      </div>
    );
  }

  function Field({ label, children }) {
    return (
      <div>
        <p className={`${TYPE.label} mb-1`}>{label}</p>
        {children}
      </div>
    );
  }

  /* ---------- AUTENTICACION (Supabase Auth, email + password) ---------- */
  /* Reutilizable en cualquier app de la familia que tenga un supabaseClient
     ya creado. No decide el nivel de acceso (eso lo controla RLS en la base
     de datos) — solo maneja la sesion y presenta el formulario. */

  function useSupabaseAuth(supabaseClient) {
    const [session, setSession] = useState(null);
    const [loading, setLoading] = useState(true);
    const [signingIn, setSigningIn] = useState(false);
    const [error, setError] = useState(null);

    useEffect(() => {
      if (!supabaseClient) { setLoading(false); return; }
      supabaseClient.auth.getSession().then(({ data }) => {
        setSession(data.session);
        setLoading(false);
      });
      const { data: sub } = supabaseClient.auth.onAuthStateChange((_event, s) => {
        setSession(s);
      });
      return () => sub.subscription.unsubscribe();
    }, [supabaseClient]);

    async function signIn(email, password) {
      setSigningIn(true);
      setError(null);
      const { error: err } = await supabaseClient.auth.signInWithPassword({ email, password });
      setSigningIn(false);
      if (err) setError(err.message);
    }

    async function signOut() {
      await supabaseClient.auth.signOut();
    }

    return { session, loading, signingIn, error, signIn, signOut };
  }

  function LoginScreen({ theme, onSubmit, loading, error }) {
    const [email, setEmail] = useState("");
    const [password, setPassword] = useState("");
    const tc = themeClasses(theme);

    function handleSubmit(e) {
      e.preventDefault();
      if (email && password) onSubmit(email, password);
    }

    return (
      <div className="min-h-screen flex items-center justify-center p-4 bg-stone-50 dark:bg-stone-950">
        <form onSubmit={handleSubmit} className="w-full max-w-sm bg-white dark:bg-stone-900 rounded-xl p-6 space-y-4 border border-stone-200 dark:border-stone-800">
          <div className="flex items-center gap-2 mb-2">
            {theme?.logo
              ? <img src={theme.logo} alt={theme.name} className="w-8 h-8 rounded-lg object-contain" />
              : <div className={`w-8 h-8 rounded-lg grid place-items-center bg-${tc.primary}-600 text-white`}><Icons.Lock size={16} /></div>}
            <div>
              <h1 className="font-semibold text-stone-900 dark:text-stone-100">{theme?.appTitle || "App"}</h1>
              <p className="text-xs text-stone-500 dark:text-stone-400">Acceso restringido</p>
            </div>
          </div>

          <Field label="Correo">
            <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)}
              placeholder="tucorreo@empresa.com" className={inputClass} autoComplete="username" />
          </Field>
          <Field label="Contraseña">
            <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)}
              placeholder="••••••••" className={inputClass} autoComplete="current-password" />
          </Field>

          {error && (
            <p className="text-xs text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 rounded-lg px-3 py-2">
              {error}
            </p>
          )}

          <button type="submit" disabled={loading}
            className={`w-full px-3 py-2 rounded-lg text-sm ${tc.primaryBtn} disabled:opacity-50`}>
            {loading ? "Entrando..." : "Entrar"}
          </button>
          <p className="text-xs text-stone-400 text-center">
            Las cuentas se crean desde el panel de Supabase, no hay registro abierto.
          </p>
        </form>
      </div>
    );
  }

  function AccessDenied({ theme, userEmail, onLogout }) {
    return (
      <div className="min-h-screen flex items-center justify-center p-4 bg-stone-50 dark:bg-stone-950">
        <div className="w-full max-w-sm bg-white dark:bg-stone-900 rounded-xl p-6 space-y-3 border border-stone-200 dark:border-stone-800 text-center">
          <div className="w-10 h-10 mx-auto rounded-full bg-red-100 dark:bg-red-950/50 grid place-items-center text-red-600 dark:text-red-400">
            <Icons.Lock size={18} />
          </div>
          <h1 className="font-semibold text-stone-900 dark:text-stone-100">Sin acceso a {theme?.appTitle || "esta app"}</h1>
          <p className="text-sm text-stone-500 dark:text-stone-400">
            Tu cuenta {userEmail ? <span className="font-medium">({userEmail})</span> : ""} es valida pero no esta autorizada para entrar aqui. Pedile a quien administra el sistema que te agregue a la lista de acceso.
          </p>
          {onLogout && (
            <button onClick={onLogout} className="text-xs text-stone-400 hover:text-stone-600 dark:hover:text-stone-300 underline">
              Salir
            </button>
          )}
        </div>
      </div>
    );
  }

  const inputClass = "w-full text-sm border border-stone-300 dark:border-stone-700 dark:bg-stone-800 dark:text-stone-100 rounded-lg px-2 py-1.5";
  const selectClass = inputClass;

  window.DS = {
    Icons, themeClasses, RISK, TYPE, SPACING,
    AppHeader, StatCard, Button, GroupBadge, ScoreBadge, TrendIcon, Modal, Field,
    useSupabaseAuth, LoginScreen, AccessDenied,
    inputClass, selectClass,
  };
})();

</script>


<script type="text/babel">
const { useState, useMemo, useCallback, useEffect } = React;

/* ====================== CONFIGURACION SUPABASE ======================
   DECISION TOMADA (importante para no repetir el error despues): este
   proyecto usa el MISMO proyecto de Supabase que "Control de Vacaciones"
   (por el limite de 2 proyectos gratis por cuenta). Para que eso no
   signifique "cualquier empleado con cuenta de vacaciones puede ver el
   analisis financiero de pegas", los datos de esta app viven en un
   schema de Postgres separado ("pegas", no "public") con su propia
   lista blanca de usuarios permitidos — un empleado de Vacaciones que
   NO esta en esa lista, aunque inicie sesion, no puede leer ni escribir
   nada del schema pegas. Las dos apps siguen siendo archivos HTML
   totalmente independientes; solo comparten el backend.

   PASOS (correr una sola vez, en el proyecto de Control de Vacaciones):

   1. Corre el SQL de mas abajo (ver SQL_SETUP) en el SQL editor de ESE
      proyecto (el de Vacaciones, no uno nuevo).
   2. Expone el schema "pegas" a la API:
      Project Settings > API > "Exposed schemas" > agrega "pegas" a la
      lista (junto a "public" que ya deberia estar). Sin este paso el
      cliente JS no puede llegar al schema aunque el SQL este correcto.
   3. Cuentas de acceso (reusa las que ya existan en ese proyecto si
      gerencia ya tiene login ahi, o crea nuevas):
      Authentication > Users > "Add user" (email + password, "Auto
      Confirm User" activado). Copia el UUID de cada usuario que SI debe
      entrar a Pegas.
   4. Agrega esos UUIDs a la lista blanca corriendo, por cada persona:
      insert into pegas.allowed_users (user_id) values ('UUID-AQUI');
   5. Ve a Project Settings > API y copia la Project URL y la anon key
      (JWT, no la "publishable") — son las MISMAS que usa Control de
      Vacaciones, no hay credenciales nuevas que generar.
   6. Pegalas aqui abajo antes de subir este archivo a GitHub Pages.
   ====================================================================== */
const SUPABASE_URL = "https://nmxcvxmieeyhecuscacm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_NI-GASqNutcHmMmede4IZw_LnXQBnlQ";

let supabaseClient = null;
try {
  if (SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY.length > 10) {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch (e) {
  console.warn("Supabase no configurado todavia:", e);
}

/* SQL_SETUP (correr una sola vez, en el SQL editor del proyecto de Control de Vacaciones):

-- Schema separado: nada de esto toca las tablas que ya usa Vacaciones.
create schema if not exists pegas;

-- Lista blanca: quien puede entrar a Pegas, sin importar si tiene
-- cuenta valida en el proyecto (esa cuenta sola no alcanza).
create table pegas.allowed_users (
  user_id uuid primary key references auth.users(id) on delete cascade
);
-- No se le da ninguna politica RLS a esta tabla a proposito: el editor
-- SQL del panel de Supabase corre como admin y la puede leer/editar
-- igual, y del lado del cliente (API) queda con acceso denegado por
-- default al no tener ninguna policy — nadie la consulta desde el navegador.
alter table pegas.allowed_users enable row level security;
-- Excepcion puntual: cada usuario puede consultar UNICAMENTE su propia
-- fila (para que la app pueda verificar "¿estoy en la lista?" sin poder
-- ver quien mas esta en ella).
create policy "solo mi propia fila" on pegas.allowed_users
  for select
  to authenticated
  using (auth.uid() = user_id);

create table pegas.uploads (
  id uuid primary key default gen_random_uuid(),
  created_at timestamptz default now(),
  nombre_archivo text,
  filas int,
  data jsonb
);
alter table pegas.uploads enable row level security;

/* ====================== IDENTIDAD DE CLIENTE ======================
   Lo UNICO que cambia entre apps de la misma familia. Todo lo demas
   (estructura, tipografia, espaciado, navegacion, componentes) viene
   del sistema de diseño compartido de arriba. Nombres de color validos:
   cualquier paleta de Tailwind (blue, emerald, violet, rose, amber, etc). */
const THEME = {
  name: "Analisis de pegas",
  appTitle: "Analisis de pegas",
  appSubtitle: "Productos de baja rotacion por sucursal",
  primary: "blue",
  secondary: "emerald",
  accent: "violet",
  logo: null, // URL de logo opcional, ej: "https://.../logo.png"
};


/* ====================== LOGICA DE DATOS ====================== */

const SUCURSALES_ESPERADAS = ["CENTRAL", "ESQUINA", "HATILLO"];

/* El sistema real exporta headers en camelCase pegado (ej. "sCodigoProducto",
   "nPrecioSinIva") — nada de espacios. OJO: la columna "Descripcion" (A) NO es
   la descripcion del producto, es la etiqueta de bodega/sucursal ("Almacen
   Local Hatillo") — la descripcion real esta en "sDescripcionProducto" (C).
   Por eso los alias mas especificos van PRIMERO en cada lista: el primero
   que matchee gana, y así nunca se confunde la columna A con la C. */
const COLUMN_MAP = {
  codigo: ["scodigoproducto", "codigo", "código", "cod"],
  descripcion: ["sdescripcionproducto", "nombre del producto", "descripcion", "descripción"],
  costo: ["ncostomercado", "costomercado", "costo mercado colones", "costo de ultima compra", "costo de última compra", "costo"],
  fechaCompra: ["dfechaultimacompra", "fechaultimacompra", "fecha de la ultima compra", "fecha de ultima compra", "fecha de última compra"],
  cantidadComprada: ["ncantidadultimacompra", "cantidadultimacompra", "cantidad de ultima compra", "cantidades compradas en total"],
  stock: ["nsaldouds", "stock", "saldo", "existencias"],
  precioSinImp: ["npreciosiniva", "preciosin", "precio sin"],
  precioConImp: ["nprecioconiva", "preciocon", "precio con"],
  /* Columnas del formato nuevo que ya vienen calculadas — se prefieren sobre
     calcularlas nosotros mismos cuando estan presentes. */
  ventaTotalDirecta: ["nunidadesnetas", "unidadesnetas"],
  ventaPromedioDirecta: ["npromediounidadesnetas", "promediounidadesnetas", "promedio"],
  margenDirecto: ["nrentabilidad", "rentabilidad"],
};

function normalizeHeader(h) {
  return String(h || "").trim().toLowerCase();
}

function buildColumnIndex(headers) {
  const idx = {};
  const normalized = headers.map(normalizeHeader);
  for (const [key, aliases] of Object.entries(COLUMN_MAP)) {
    let found = -1;
    for (const alias of aliases) {
      const i = normalized.findIndex((h) => h === alias || h.includes(alias));
      if (i !== -1) { found = i; break; }
    }
    idx[key] = found;
  }
  return idx;
}

/* Detecta columnas de mes en dos formatos posibles:
   - viejo: "Jul-25", "Ago-25"
   - nuevo: "nEnero", "nFebrero"... "nDiciembre" (el que exporta el sistema real) */
const MESES_ES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
function isMonthHeader(h) {
  const s = String(h || "").trim().toLowerCase();
  if (/^[a-zA-Z]{3}-\d{2}$/.test(s)) return true;
  const sinPrefijoN = s.startsWith("n") ? s.slice(1) : s;
  return MESES_ES.includes(sinPrefijoN);
}

/* Determina a que mes/anio real corresponde una columna, para poder
   distinguir meses que ya pasaron de meses futuros. El formato "nuevo"
   (nEnero..nDiciembre) no trae anio en el nombre: se asume el anio en curso,
   que es como el sistema real exporta el corte del anio actual. */
const HOY = new Date();
const ANIO_ACTUAL = HOY.getFullYear();
const MES_ACTUAL_IDX = HOY.getMonth(); // 0 = enero
function monthColumnInfo(h) {
  const s = String(h || "").trim().toLowerCase();
  const mViejo = s.match(/^([a-z]{3})-(\d{2})$/);
  if (mViejo) {
    const abrevs = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
    const mi = abrevs.indexOf(mViejo[1]);
    return mi === -1 ? null : { monthIndex: mi, year: 2000 + parseInt(mViejo[2], 10) };
  }
  const sinPrefijoN = s.startsWith("n") ? s.slice(1) : s;
  const mi2 = MESES_ES.indexOf(sinPrefijoN);
  return mi2 === -1 ? null : { monthIndex: mi2, year: ANIO_ACTUAL };
}
/* Meses futuros vienen en 0 porque todavia no han sucedido, no porque el
   producto dejo de venderse — hay que excluirlos del conteo, o inflan
   artificialmente "meses sin venta" y diluyen el promedio de venta. */
function esColumnaFutura(info) {
  if (!info) return false;
  if (info.year > ANIO_ACTUAL) return true;
  if (info.year === ANIO_ACTUAL && info.monthIndex > MES_ACTUAL_IDX) return true;
  return false;
}

/* La fecha de ultima compra puede llegar como objeto Date (Excel con formato
   de fecha), numero de serie de Excel (fecha sin formato), o texto en varios
   formatos comunes -- se intenta interpretar en ese orden. */
function parseFechaCompra(val) {
  if (!val) return null;
  if (val instanceof Date && !isNaN(val.getTime())) return val;
  if (typeof val === "number") {
    const ms = Math.round((val - 25569) * 86400 * 1000);
    const d = new Date(ms);
    return isNaN(d.getTime()) ? null : d;
  }
  if (typeof val === "string") {
    const s = val.trim();
    const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
    if (m) {
      let [, d, mo, y] = m;
      if (y.length === 2) y = "20" + y;
      const dt = new Date(parseInt(y, 10), parseInt(mo, 10) - 1, parseInt(d, 10));
      return isNaN(dt.getTime()) ? null : dt;
    }
    const dt2 = new Date(s);
    return isNaN(dt2.getTime()) ? null : dt2;
  }
  return null;
}

function diasDesdeFecha(fecha) {
  if (!fecha) return null;
  return Math.floor((HOY.getTime() - fecha.getTime()) / 86400000);
}

/* Enriquece una fila de producto con los datos derivados de su ultima
   compra (fecha interpretada, capital de esa compra, dias transcurridos,
   y para cuantos meses alcanza esa cantidad al ritmo de venta actual).
   Extraido a funcion propia para que tanto la vista de Compras (sobre el
   filtro activo) como Acciones/Inicio (sobre todo el inventario, sin
   depender de que filtro haya quedado puesto en otra pantalla) usen
   exactamente el mismo calculo, sin duplicar logica. */
function enriquecerCompra(r) {
  const fechaCompraParsed = parseFechaCompra(r.fechaUltimaCompra);
  const capitalCompra = (r.cantidadUltimaCompra || 0) * r.costo;
  const diasDesdeCompra = diasDesdeFecha(fechaCompraParsed);
  const mesesQueAlcanza = r.ventaPromedio > 0 && r.cantidadUltimaCompra > 0 ? r.cantidadUltimaCompra / r.ventaPromedio : null;
  return { ...r, fechaCompraParsed, capitalCompra, diasDesdeCompra, mesesQueAlcanza };
}
const UMBRAL_SOBRECOMPRA_MESES = 6;

function toNumber(value) {
  if (typeof value === "number") return value;
  if (typeof value === "string") {
    const cleaned = value.replace(/[^0-9.,-]/g, "").replace(",", ".");
    const n = parseFloat(cleaned);
    return isNaN(n) ? 0 : n;
  }
  return 0;
}

/* Lee una hoja de sucursal completa. Soporta dos formatos de Excel:
   - Formato nuevo (el real, que exporta el sistema): headers camelCase pegado,
     sin fila de subtitulo ni fila TOTAL de resumen — los datos empiezan en la
     fila 2. Trae venta total, promedio y margen ya calculados en sus propias
     columnas, ademas de cantidad y fecha de la ultima compra con datos reales.
   - Formato viejo (mockup original): fila 1 headers, fila 2 subtitulo, fila 3
     TOTAL de resumen, datos desde fila 4, sin cantidad/fecha de compra.
   Se detecta solo, columna por columna, sin necesidad de saber cual formato es. */
function parseSucursalSheet(rows, sucursal, marginLookup) {
  if (!rows.length) return [];
  const headers = rows[0];
  const idx = buildColumnIndex(headers);
  const monthColsRaw = [];
  headers.forEach((h, i) => { if (isMonthHeader(h)) monthColsRaw.push(i); });
  // Se descartan columnas de meses futuros (el mes todavia no ha ocurrido,
  // por eso viene en 0 -- no es que el producto no se vendio) y se ordenan
  // cronologicamente, sin depender de como esten fisicamente en el Excel.
  const monthCols = monthColsRaw
    .map((i) => ({ i, info: monthColumnInfo(headers[i]) }))
    .filter(({ info }) => info && !esColumnaFutura(info))
    .sort((a, b) => (a.info.year - b.info.year) || (a.info.monthIndex - b.info.monthIndex))
    .map(({ i }) => i);
  const totalIdx = headers.findIndex((h) => normalizeHeader(h) === "total");
  const promedioIdx = headers.findIndex((h) => normalizeHeader(h) === "promedio");

  function valOrUndefined(rowArr, i) {
    if (i === -1) return undefined;
    const v = rowArr[i];
    return v === undefined || v === null || v === "" ? undefined : v;
  }

  const out = [];
  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    if (!row) continue;
    const codigoRaw = idx.codigo !== -1 ? row[idx.codigo] : undefined;
    const codigo = codigoRaw === undefined || codigoRaw === null ? "" : String(codigoRaw).trim();
    // fila basura que a veces manda el sistema (codigo "*" con datos sin sentido) y
    // la fila de resumen "TOTAL" del formato viejo — ambas se descartan.
    if (!codigo || codigo === "*" || codigo.toUpperCase() === "TOTAL") continue;

    // Se preserva si la columna realmente existia con un dato utilizable,
    // para poder distinguir "0 real" de "no disponible" en la interfaz sin
    // tocar el valor numerico que ya usan margen/utilidad/capital atrapado.
    const costoValor = valOrUndefined(row, idx.costo);
    const costo = toNumber(costoValor ?? 0);
    const costoDisponible = costoValor !== undefined;
    const precioSinImpValor = valOrUndefined(row, idx.precioSinImp);
    const precioSinImp = toNumber(precioSinImpValor ?? 0);
    const precioSinImpDisponible = precioSinImpValor !== undefined;
    const precioConImpValor = valOrUndefined(row, idx.precioConImp);
    const precioConImp = toNumber(precioConImpValor ?? 0);
    const precioConImpDisponible = precioConImpValor !== undefined;

    let margen;
    let margenEstimado = false;
    const margenDirecto = valOrUndefined(row, idx.margenDirecto);
    if (margenDirecto !== undefined) {
      margen = toNumber(margenDirecto);
    } else if (costo > 0 && precioSinImp > 0) {
      margen = (precioSinImp / costo - 1) * 100;
    } else if (marginLookup && marginLookup[codigo] !== undefined) {
      margen = marginLookup[codigo];
      margenEstimado = true;
    } else {
      margen = 0;
    }

    const ventasMensuales = monthCols.map((ci) => toNumber(row[ci]));

    const ventaTotalDirecta = valOrUndefined(row, idx.ventaTotalDirecta) ?? (totalIdx !== -1 ? valOrUndefined(row, totalIdx) : undefined);
    const ventaTotal = ventaTotalDirecta !== undefined ? toNumber(ventaTotalDirecta) : ventasMensuales.reduce((a, b) => a + b, 0);

    const ventaPromedioDirecta = valOrUndefined(row, idx.ventaPromedioDirecta) ?? (promedioIdx !== -1 ? valOrUndefined(row, promedioIdx) : undefined);
    const ventaPromedio = ventaPromedioDirecta !== undefined ? toNumber(ventaPromedioDirecta) : (ventasMensuales.length ? ventaTotal / ventasMensuales.length : 0);

    let mesesSinVenta = 0;
    for (let m = ventasMensuales.length - 1; m >= 0; m--) {
      if (ventasMensuales[m] > 0) break;
      mesesSinVenta++;
    }

    out.push({
      sucursal,
      codigo,
      descripcion: String(idx.descripcion !== -1 ? row[idx.descripcion] ?? "" : "").trim(),
      costo,
      costoDisponible,
      stock: toNumber(idx.stock !== -1 ? row[idx.stock] : 0),
      precioSinImp,
      precioSinImpDisponible,
      precioConImp,
      precioConImpDisponible,
      margen: Math.round(margen * 10) / 10,
      margenEstimado,
      ventaTotal,
      ventaPromedio: Math.round(ventaPromedio * 100) / 100,
      mesesSinVenta,
      mesesMonitoreados: monthCols.length || 13,
      ventasMensuales,
      // Nuevos, disponibles ahora que el Excel real los trae con datos reales
      // (antes venian vacios). No se usan todavia en ninguna vista — quedan
      // capturados para cuando quieras el reporte de eficiencia de compra.
      cantidadUltimaCompra: idx.cantidadComprada !== -1 ? toNumber(row[idx.cantidadComprada]) : 0,
      fechaUltimaCompra: valOrUndefined(row, idx.fechaCompra) ?? null,
    });
  }
  return out;
}

/* Hoja de respaldo "CODIGOS %": Codigo, Descripcion, Util, MARGEN EN %.
   Se usa "Util" (precio/costo) para calcular el margen real, no la columna "MARGEN EN %"
   de esa hoja (parece tener un error de escala). Solo se usa si el producto no trae
   costo/precio directo en su hoja de sucursal. */
function parseMarginLookup(rows) {
  const map = {};
  if (!rows.length) return map;
  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    if (!row) continue;
    const codigo = row[0] === undefined || row[0] === null ? "" : String(row[0]).trim();
    const util = toNumber(row[2]);
    if (codigo && util > 0) map[codigo] = (util - 1) * 100;
  }
  return map;
}

function clasificarTendencia(r) {
  if (!r.ventaTotal || r.ventaTotal <= 0) return "nunca_vendio";
  const n = r.ventasMensuales ? r.ventasMensuales.length : 0;
  if (n < 6) return "estable"; // no hay suficiente historial para hablar de tendencia
  const ultimos = r.ventasMensuales.slice(-3);
  const previos = r.ventasMensuales.slice(0, n - 3);
  const promUltimos = ultimos.reduce((a, b) => a + b, 0) / ultimos.length;
  const promPrevios = previos.length ? previos.reduce((a, b) => a + b, 0) / previos.length : 0;
  if (promPrevios > 0 && promUltimos < promPrevios * 0.4) return "declive";
  if (promPrevios > 0 && promUltimos > promPrevios * 1.3) return "creciendo";
  return "estable";
}

function enrich(rows) {
  return rows.map((r) => {
    const utilidadUnitaria = r.precioSinImp - r.costo;
    return {
      ...r,
      capitalAtrapado: r.costo * r.stock,
      mesesInventario: r.ventaPromedio > 0 ? r.stock / r.ventaPromedio : null,
      utilidadUnitaria,
      utilidadTotal: utilidadUnitaria * (r.ventaTotal || 0),
      tendencia: clasificarTendencia(r),
    };
  });
}

function rankPercentile(values, value) {
  if (!values.length) return 0;
  const sorted = [...values].sort((a, b) => a - b);
  let count = 0;
  for (const v of sorted) if (v <= value) count++;
  return count / sorted.length;
}

/* Version eficiente: ordena una sola vez y usa busqueda binaria por consulta,
   en vez de re-ordenar todo el arreglo por cada fila (critico con miles de productos). */
function makePercentileLookup(values) {
  const sorted = [...values].sort((a, b) => a - b);
  const n = sorted.length;
  return (value) => {
    if (!n) return 0;
    let lo = 0, hi = n;
    while (lo < hi) {
      const mid = (lo + hi) >>> 1;
      if (sorted[mid] <= value) lo = mid + 1;
      else hi = mid;
    }
    return lo / n;
  };
}

function withScore(rows) {
  const capitalPercentil = makePercentileLookup(rows.map((r) => r.capitalAtrapado));
  const mesesPercentil = makePercentileLookup(rows.map((r) => r.mesesSinVenta ?? 0));
  const margenPercentil = makePercentileLookup(rows.map((r) => r.margen));
  return rows.map((r) => {
    const pCapital = capitalPercentil(r.capitalAtrapado);
    const pMeses = mesesPercentil(r.mesesSinVenta ?? 0);
    const pMargenBajo = 1 - margenPercentil(r.margen);
    const score = pCapital * 0.4 + pMeses * 0.35 + pMargenBajo * 0.25;
    return { ...r, score, pCapital, pMeses, pMargenBajo };
  });
}

function money(n, symbol) {
  const formatted = new Intl.NumberFormat("es-CR", { maximumFractionDigits: 0 }).format(Math.round(n || 0));
  return symbol ? `${symbol} ${formatted}` : formatted;
}

/* ---------- Busqueda tolerante a errores (codigo y descripcion) ----------
   Quita tildes/mayusculas, y si una palabra de la busqueda no aparece tal
   cual, prueba con distancia de edicion (Levenshtein) contra las palabras
   del texto — asi "cament" encuentra "cemento" y "esmeril" encuentra
   "esmeriladora" aunque el usuario no escriba la palabra completa o se
   equivoque una o dos letras. */
function normalizarTexto(s) {
  return String(s || "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().trim();
}

function distanciaEdicion(a, b) {
  if (a === b) return 0;
  const la = a.length, lb = b.length;
  if (la === 0) return lb;
  if (lb === 0) return la;
  let prev = new Array(lb + 1);
  let curr = new Array(lb + 1);
  for (let j = 0; j <= lb; j++) prev[j] = j;
  for (let i = 1; i <= la; i++) {
    curr[0] = i;
    for (let j = 1; j <= lb; j++) {
      const costo = a[i - 1] === b[j - 1] ? 0 : 1;
      curr[j] = Math.min(prev[j] + 1, curr[j - 1] + 1, prev[j - 1] + costo);
    }
    [prev, curr] = [curr, prev];
  }
  return prev[lb];
}

function tokenCoincide(token, palabras, maxTolerancia) {
  for (const palabra of palabras) {
    if (palabra.includes(token) || token.includes(palabra)) return true;
    // tolerancia proporcional al largo: 1 error en palabras cortas, 2 en largas,
    // pero nunca mas que maxTolerancia (los codigos numericos usan un limite
    // mas estricto — un codigo con 2 digitos distintos ya es OTRO producto,
    // no un error de tipeo).
    let tolerancia = token.length <= 4 ? 1 : token.length <= 8 ? 2 : 3;
    if (maxTolerancia !== undefined) tolerancia = Math.min(tolerancia, maxTolerancia);
    if (Math.abs(palabra.length - token.length) <= tolerancia && distanciaEdicion(token, palabra) <= tolerancia) return true;
  }
  return false;
}

/* query puede traer varias palabras separadas por espacio — todas deben
   encontrar algo asociado para que el texto cuente como resultado. */
function coincideCampo(query, texto, maxTolerancia) {
  const q = normalizarTexto(query);
  if (!q) return true;
  const tokens = q.split(/\s+/).filter(Boolean);
  const t = normalizarTexto(texto);
  if (t.includes(q)) return true;
  const palabras = t.split(/\s+/).filter(Boolean);
  return tokens.every((tok) => tokenCoincide(tok, palabras, maxTolerancia));
}

/* Que tan cerca esta el texto de la busqueda, para ordenar los resultados
   con lo mas exacto primero: 0 = coincide exacto, 1 = empieza igual,
   2 = lo contiene, 3 = solo coincide "parecido" (tolerancia de tipeo). */
function rangoCoincidencia(query, texto) {
  const q = normalizarTexto(query);
  if (!q) return 0;
  const t = normalizarTexto(texto);
  if (t === q) return 0;
  if (t.startsWith(q)) return 1;
  if (t.includes(q)) return 2;
  return 3;
}

/* Buscador numerico para margen y utilidad (no son texto, son valores).
   Acepta tres formas de escribir:
   - un numero solo (ej "20")            -> los valores CERCANOS a 20
   - un rango (ej "10-30")                -> los que caen entre 10 y 30
   - un comparador (ej ">20", "<=15")     -> mayor/menor que ese valor
   Devuelve {ok, distancia} — distancia se usa despues para ordenar de mas
   cercano a menos cercano cuando la busqueda es por numero simple. */
function coincideNumero(query, valor) {
  const q = String(query || "").trim();
  if (!q) return { ok: true, distancia: 0 };
  if (valor === undefined || valor === null || Number.isNaN(valor)) return { ok: false, distancia: Infinity };

  const rango = q.match(/^(-?\d+(?:\.\d+)?)\s*-\s*(-?\d+(?:\.\d+)?)$/);
  if (rango) {
    const a = parseFloat(rango[1]), b = parseFloat(rango[2]);
    const min = Math.min(a, b), max = Math.max(a, b);
    return { ok: valor >= min && valor <= max, distancia: 0 };
  }

  const comp = q.match(/^(>=|<=|>|<)\s*(-?\d+(?:\.\d+)?)$/);
  if (comp) {
    const n = parseFloat(comp[2]);
    const op = comp[1];
    const ok = op === ">" ? valor > n : op === "<" ? valor < n : op === ">=" ? valor >= n : valor <= n;
    return { ok, distancia: Math.abs(valor - n) };
  }

  const n = parseFloat(q);
  if (!Number.isNaN(n)) {
    const tolerancia = Math.max(2, Math.abs(n) * 0.15); // +/-15%, minimo 2 unidades
    const distancia = Math.abs(valor - n);
    return { ok: distancia <= tolerancia, distancia };
  }

  return { ok: false, distancia: Infinity };
}

/* Clasificacion calculada por la app (no viene del Excel): Grupo A = mayor riesgo/prioridad,
   Grupo B = riesgo medio, Grupo C = bajo riesgo, buen movimiento. */
function grupoCalculado(score) {
  if (score >= 0.66) return "A";
  if (score >= 0.33) return "B";
  return "C";
}

/* ====================== ESTRATEGIA FINANCIERA AVANZADA ======================
   Motor de planes por fases (sin IA externa). Simula el criterio combinado de
   un estratega de mercadeo (como mover el producto sin devaluar la marca) y
   un CFO (proteger el capital, saber cuando cortar perdidas). Cada arquetipo
   entrega un plan de 1-3 fases con acciones concretas y numeros calculados
   desde el propio producto (nunca genericos), un criterio de exito por fase,
   y que hacer si esa fase no funciona.
   Usa los percentiles ya calculados en withScore: pCapital, pMeses, pMargenBajo. */

const ARCHETYPE_INFO = {

  liquidacion_agresiva: { label: "Liquidar con descuento", color: "bg-orange-100 text-orange-700 dark:bg-orange-900/40 dark:text-orange-300" },
  promocion_combo: { label: "Combo primero", color: "bg-violet-100 text-violet-700 dark:bg-violet-900/40 dark:text-violet-300" },

/* Precio de venta actual (sin impuesto) y el "piso" bajo el cual ya no
   conviene bajar mas (margen minimo aceptable del 5% sobre costo). */
function precioBaseYPiso(r) {
  const precioActual = r.precioSinImp > 0 ? r.precioSinImp : (r.precioConImp > 0 ? r.precioConImp / 1.13 : 0);
  const precioPiso = r.costo * 1.05;
  return { precioActual, precioPiso };
}

/* Calcula un descuento real (no arbitrario): el maximo posible sin perforar
   el piso de margen minimo, topado a maxPct para que la rebaja siga siendo
   creible como promocion y no como panico. */
function descuentoSugerido(r, maxPct) {
  const { precioActual, precioPiso } = precioBaseYPiso(r);
  if (precioActual <= 0) return { pct: 0, precioNuevo: 0 };
  let pct = Math.round((1 - precioPiso / precioActual) * 100);
  pct = Math.max(5, Math.min(pct, maxPct));
  const precioNuevo = Math.round(precioActual * (1 - pct / 100));
  return { pct, precioNuevo };
}

function estrategiaAvanzada(r, ctx) {
  const fmt = (n) => money(n, ctx.moneda);
  const altoCapital = r.pCapital >= 0.66;
  const medioCapital = r.pCapital >= 0.33 && r.pCapital < 0.66;
  const altoMeses = r.pMeses >= 0.66;
  const bajoMeses = r.pMeses < 0.33;
  const margenBajo = r.pMargenBajo >= 0.66;
  const margenAlto = r.pMargenBajo < 0.33;
  const sinVentaTotal = r.mesesSinVenta >= r.mesesMonitoreados;

  const socio = ctx.topSellerPorSucursal[r.sucursal];
  const socioValido = socio && socio.codigo !== r.codigo ? socio : null;
  const otraSucursal = ctx.mejorSucursalPorCodigo[r.codigo];
  const trasladoValido = otraSucursal && otraSucursal.sucursal !== r.sucursal
    && otraSucursal.ventaPromedio > (r.ventaPromedio || 0) * 1.5 ? otraSucursal : null;

  // Arquetipo 1: cero ventas en todo el periodo + mucho capital -> cortar perdidas ya.
  if (sinVentaTotal && altoCapital) {
    const d = descuentoSugerido(r, 45);
    return {
      archetype: "salida_rapida",
      diagnostico: `Cero movimiento en ${r.mesesMonitoreados} meses con ${fmt(r.capitalAtrapado)} de capital inmovilizado. No hay evidencia de que vaya a rotar solo: la prioridad es recuperar capital, no proteger margen.`,
      fases: [
        {
          nombre: "Fase 1 - Liquidacion relampago",
          duracion: "2 semanas",
          acciones: [
            `Bajar el precio a ${fmt(d.precioNuevo)} (antes ${fmt(precioBaseYPiso(r).precioActual)}, ${d.pct}% de descuento) marcado como "oferta relampago".`,
            "Ubicarlo en punto visible (vitrina, mostrador o destacado en catalogo digital) los primeros dias.",
            trasladoValido
              ? `Antes de rematar, evaluar trasladarlo a ${otraSucursal.sucursal}: ese mismo codigo vende ahi unas ${Math.round(otraSucursal.ventaPromedio)} u/mes, mas que aqui.`
              : "Avisar por WhatsApp o redes a los clientes frecuentes de esta sucursal.",
          ],
          exito: "Se vende al menos la mitad del stock en las 2 semanas.",
          siNoFunciona: "Pasar a Fase 2: salida total.",
        },
        {
          nombre: "Fase 2 - Salida total",
          duracion: "Inmediata despues de fase 1",
          acciones: [
            "Consultar al proveedor si acepta devolucion, cambio por otro producto o nota de credito.",
            `Si no hay devolucion posible, liquidar el resto a precio de costo (${fmt(r.costo)}) o menos: aqui recuperar capital pesa mas que proteger margen.`,
            "Dar de baja el remanente que no se venda y no volver a comprar este producto.",
          ],
          exito: "Bodega libre del producto y capital recuperado, aunque sea parcial.",
          siNoFunciona: null,
        },
      ],
    };
  }

  // Arquetipo 2: mucho capital + margen ya delgado + muchos meses -> el peor caso.
  if (altoCapital && margenBajo && altoMeses) {
    const d = descuentoSugerido(r, 20);
    return {
      archetype: "liquidacion_agresiva",
      diagnostico: `Combina las tres senales a la vez: mucho capital (${fmt(r.capitalAtrapado)}), margen ya delgado (${r.margen}%) y ${r.mesesSinVenta} meses sin venderse. Cada mes adicional en bodega cuesta mas de lo que puede recuperar.`,
      fases: [
        {
          nombre: "Fase 1 - Precio especial por tiempo limitado",
          duracion: "30 dias",
          acciones: [
            `Bajar el precio a ${fmt(d.precioNuevo)} (${d.pct}% de descuento, calculado para no vender debajo de costo) por 30 dias.`,
            "Presentarlo como precio especial temporal, no como remate permanente, para no devaluar el producto de una vez.",
            "Revisar la venta cada semana; si a mitad del periodo no repunta, saltar directo a Fase 2.",
          ],
          exito: `Vende al menos el doble de su promedio historico (${Math.round((r.ventaPromedio || 0) * 2)} u en el mes).`,
          siNoFunciona: "Pasar a Fase 2: combo forzado.",
        },
        {
          nombre: "Fase 2 - Combo forzado",
          duracion: "Siguiente mes",
          acciones: [
            socioValido
              ? `Armar combo con "${socioValido.descripcion}" (vende ~${Math.round(socioValido.ventaPromedio)} u/mes en esta sucursal): "lleve ambos con descuento adicional".`
              : "Armar combo con el producto de mayor rotacion disponible en esta sucursal.",
            "Mover el combo a exhibicion junto al producto de alta rotacion, no dejarlo en su lugar habitual.",
          ],
          exito: "El stock baja de forma sostenida, aunque sea via el combo y no por venta individual.",
          siNoFunciona: `Pasar a liquidacion final: vender el resto a costo (${fmt(r.costo)}) o gestionar devolucion con el proveedor.`,
        },
      ],
    };
  }

  // Arquetipo 3: mucho capital pero con margen bueno -> hay espacio, empezar por combo, no por precio.
  if (altoCapital && margenAlto && altoMeses) {
    const d = descuentoSugerido(r, 15);
    return {
      archetype: "promocion_combo",
      diagnostico: `Tiene margen sano (${r.margen}%) pese a llevar ${r.mesesSinVenta} meses sin venderse, con ${fmt(r.capitalAtrapado)} de capital en juego. Hay espacio para maniobrar sin sacrificar precio de una vez.`,
      fases: [
        {
          nombre: "Fase 1 - Combo o regalo con compra",
          duracion: "3-4 semanas",
          acciones: [
            socioValido
              ? `Combinarlo con "${socioValido.descripcion}" (el producto que mas rota en esta sucursal, ~${Math.round(socioValido.ventaPromedio)} u/mes): se mueve el inventario sin tocar el precio de lista.`
              : "Ofrecerlo como regalo o valor agregado en compras sobre cierto monto, aprovechando que el margen lo permite.",
            "Capacitar al equipo de venta para que lo sugiera activamente como complemento, no como oferta de descuento.",
          ],
          exito: "El stock se reduce de forma visible sin tocar el precio publicado.",
          siNoFunciona: "Pasar a Fase 2: promocion con descuento moderado.",
        },
        {
          nombre: "Fase 2 - Descuento moderado",
          duracion: "Siguiente mes",
          acciones: [
            `Bajar el precio a ${fmt(d.precioNuevo)} (${d.pct}% de descuento) por tiempo limitado, todavia dentro de un margen saludable.`,
          ],
          exito: "Vuelve a venderse a ritmo normal dentro del mes.",
          siNoFunciona: "Si sigue sin moverse tras dos meses de intentos, reclasificar como candidato a liquidacion agresiva en el proximo corte.",
        },
      ],
    };
  }

  // Arquetipo 4: mucho capital pero vendio recientemente -> aun no es una pega real.
  if (altoCapital && bajoMeses) {
    return {
      archetype: "monitorear",
      diagnostico: `Hay bastante capital invertido (${fmt(r.capitalAtrapado)}), pero todavia se vendio hace poco. Todavia no hay suficiente tiempo sin movimiento para tratarlo como problema de rotacion.`,
      fases: [
        {
          nombre: "Seguimiento",
          duracion: "Revisar el proximo corte mensual",
          acciones: [
            "No tocar el precio todavia; no hay senal suficiente de estancamiento.",
            "Evitar comprar mas unidades de este producto hasta ver como evoluciona el siguiente mes.",
          ],
          exito: null,
          siNoFunciona: null,
        },
      ],
    };
  }

  // Arquetipo 5: capital bajo, margen bajo, muchos meses -> no amerita gestion dedicada.
  if (!altoCapital && !medioCapital && altoMeses && margenBajo) {
    return {
      archetype: "baja_prioridad",
      diagnostico: `El capital atrapado (${fmt(r.capitalAtrapado)}) es bajo, asi que el impacto financiero de dejarlo quieto es menor. No justifica tiempo de gestion individual.`,
      fases: [
        {
          nombre: "Incluir en liquidacion general",
          duracion: "Proxima liquidacion de temporada",
          acciones: [
            "Sumarlo al lote de descuento general o outlet en vez de darle seguimiento dedicado.",
            "No repetir la compra de este producto salvo pedido puntual de un cliente.",
          ],
          exito: null,
          siNoFunciona: null,
        },
      ],
    };
  }

  // Arquetipo 6: capital bajo, margen bueno, muchos meses -> mejor negociar devolucion.
  if (!altoCapital && altoMeses && margenAlto) {
    return {
      archetype: "evaluar_devolucion",
      diagnostico: `El capital atrapado es bajo (${fmt(r.capitalAtrapado)}) y el margen es bueno (${r.margen}%), pero lleva ${r.mesesSinVenta} meses sin venderse. Devolverlo puede ser mejor negocio que descontarlo.`,
      fases: [
        {
          nombre: "Fase 1 - Negociar con el proveedor",
          duracion: "Esta semana",
          acciones: [
            "Consultar si el proveedor acepta devolucion, cambio por otro producto o nota de credito.",
          ],
          exito: "El proveedor acepta devolucion o cambio.",
          siNoFunciona: "Pasar a Fase 2.",
        },
        {
          nombre: "Fase 2 - Aprovechar el margen sin bajar precio",
          duracion: "Si no hay devolucion",
          acciones: [
            "Como el margen lo permite y el capital en juego es bajo, ofrecerlo como regalo o incentivo con compras mayores en vez de descontarlo en el catalogo.",
          ],
          exito: null,
          siNoFunciona: null,
        },
      ],
    };
  }

  // Arquetipo 7: todo en rango medio, sin senal fuerte.
  if (medioCapital && !altoMeses && !margenBajo) {
    return {
      archetype: "sin_accion",
      diagnostico: "Los indicadores estan en rango medio, sin ninguna senal fuerte de riesgo todavia.",
      fases: [
        {
          nombre: "Sin accion inmediata",
          duracion: "Revisar el proximo corte mensual",
          acciones: ["Monitorear en el proximo listado en vez de tomar una accion ahora."],
          exito: null,
          siNoFunciona: null,
        },
      ],
    };
  }

  return {
    archetype: "revisar_proximo_corte",
    diagnostico: "No hay una combinacion clara de senales de riesgo todavia.",
    fases: [
      {
        nombre: "Revisar en el proximo corte",
        duracion: "Proximo listado mensual",
        acciones: ["Volver a evaluar este producto el proximo mes para ver como evoluciona."],
        exito: null,
        siNoFunciona: null,
      },
    ],
  };
}

/* Detecta el simbolo de moneda tal como aparece en las columnas de costo/precio
   del Excel original (raw:false trae el texto formateado, ej. "₡8,500.00") */
function detectCurrencySymbol(rowsFormatted, idx) {
  const candidateCols = ["costo", "precioSinImp", "precioConImp"].map((k) => idx[k]).filter((i) => i !== -1);
  for (const col of candidateCols) {
    for (let r = 1; r < Math.min(rowsFormatted.length, 20); r++) {
      const cell = rowsFormatted[r] ? rowsFormatted[r][col] : undefined;
      if (typeof cell === "string") {
        const match = cell.match(/[^\d\s.,-]+/);
        if (match && match[0].trim()) return match[0].trim();
      }
    }
  }
  return null;
}

function sampleData() {
  const sucursales = ["CENTRAL", "ESQUINA", "HATILLO"];
  const nombres = [
    "Perfume Aurea 100ml", "Perfume Nocturne 50ml", "Tenis runner blanco", "Tenis urban negro",
    "Perfume Velvet Rose", "Sandalia clasica", "Perfume Oud Intense", "Tenis skate gris",
    "Perfume Citrus Fresh", "Bota casual cafe", "Perfume Amber Wood", "Tenis training azul",
  ];
  const rows = [];
  let n = 0;
  for (const suc of sucursales) {
    for (let i = 0; i < 12; i++) {
      n++;
      const nombre = nombres[(n * 3) % nombres.length];
      const costo = 8000 + ((n * 137) % 40000);
      const stock = 1 + ((n * 5) % 30);
      const margenPct = 8 + ((n * 13) % 45);
      const precioSinImp = costo * (1 + margenPct / 100);
      const precioConImp = precioSinImp * 1.13;
      const mesesMonitoreados = 13;
      // simula estacionalidad: algunos productos sin venta reciente, otros con venta activa
      const patron = n % 4;
      const ventasMensuales = Array.from({ length: mesesMonitoreados }, (_, m) => {
        if (patron === 0) return 0; // sin ninguna venta
        if (patron === 1 && m < mesesMonitoreados - 8) return 0; // sin venta hace 8 meses
        return (n + m) % 5;
      });
      const ventaTotal = ventasMensuales.reduce((a, b) => a + b, 0);
      const ventaPromedio = ventaTotal / mesesMonitoreados;
      let mesesSinVenta = 0;
      for (let m = ventasMensuales.length - 1; m >= 0; m--) {
        if (ventasMensuales[m] > 0) break;
        mesesSinVenta++;
      }
      rows.push({
        sucursal: suc, codigo: `SKU-${1000 + n}`, descripcion: nombre, costo, stock,
        precioSinImp, precioConImp, margen: Math.round(margenPct * 10) / 10, margenEstimado: false,
        ventaTotal, ventaPromedio: Math.round(ventaPromedio * 100) / 100, mesesSinVenta, mesesMonitoreados,
        ventasMensuales,
      });
    }
  }
  return rows;
}
